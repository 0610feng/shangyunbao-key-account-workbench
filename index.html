<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>商云宝·客户管家台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2563eb;--primary-light:#dbeafe;--primary-lighter:#eff6ff;--primary-dark:#1d4ed8;
  --bg:#f8fafc;--card:#ffffff;--text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;
  --danger:#ef4444;--danger2:#fef2f2;
  --success:#10b981;--success2:#ecfdf5;
  --warn:#f59e0b;--warn2:#fffbeb;
  --r:12px;--rs:8px;--rxs:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --shadow2:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow3:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --t:.2s ease;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* === LOGIN === */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow3);padding:36px 28px;width:100%;max-width:400px}
.login-card h1{font-size:24px;text-align:center;margin-bottom:4px;color:var(--primary)}
.login-card .login-sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:24px}
.login-card .login-hint{text-align:center;font-size:12px;color:var(--text3);margin-top:16px;line-height:1.8}
.login-card .login-hint code{background:var(--primary-lighter);padding:2px 6px;border-radius:4px;font-weight:700;color:var(--primary-dark)}
.pass-input-box{position:relative}
.pass-input-box input{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--rs);
  font-size:20px;font-family:inherit;text-align:center;letter-spacing:6px;outline:none;
  transition:var(--t);
}
.pass-input-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:8px;min-height:20px}

/* === HEADER === */
.app-header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;box-shadow:var(--shadow);
}
.app-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.user-bar{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;font-weight:600}
.role-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.role-tag.admin{background:var(--primary-light);color:var(--primary-dark)}
.role-tag.member{background:var(--success2);color:var(--success)}
.btn-logout{font-size:12px;color:var(--text3);cursor:pointer;padding:4px 8px;border-radius:4px;background:none;border:none}
.btn-logout:hover{background:var(--border2);color:var(--danger)}

/* === TODAY BAR === */
.today-bar{background:var(--card);margin:12px 16px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow)}
.today-bar .today-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.today-bar .today-ttl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.ti-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border2)}
.ti-row:last-child{border-bottom:none}
.ti-row.overdue{color:var(--danger)}
.ti-pri{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;flex-shrink:0}
.ti-pri.P0{background:var(--danger2);color:var(--danger)}
.ti-pri.P1{background:var(--warn2);color:#b45309}
.ti-pri.P2{background:var(--border2);color:var(--text3)}
.ti-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-carousel{position:relative;min-height:64px}
.ti-slide{display:none;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.ti-slide.active{display:flex}
.ti-slide-main{flex:1;min-width:0}
.ti-slide-title{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.ti-slide-title .ti-text{display:block}
.ti-slide-desc{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-slide-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-top:4px}
.ti-slide.overdue .ti-slide-meta{color:var(--danger)}
.ti-carousel-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.ti-carousel-count{font-size:11px;color:var(--text3);min-width:42px;text-align:center}

/* === NAV TABS === */
.nav-tabs{display:flex;gap:0;margin:0 16px;background:var(--card);border-radius:var(--r) var(--r) 0 0;overflow:hidden;
  border:1px solid var(--border);border-bottom:none}
.nav-tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--text3);border-bottom:2px solid transparent;background:var(--border2);transition:var(--t)}
.nav-tab.active{color:var(--primary);background:var(--card);border-bottom-color:var(--primary)}
.nav-tab:hover:not(.active){color:var(--text2)}
.main-content{background:var(--card);margin:0 16px;padding:16px;border:1px solid var(--border);
  border-top:none;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);flex:1}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* === CARDS & SHARED === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-ttl{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border:1px solid var(--border);
  border-radius:var(--rs);background:var(--card);color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;transition:var(--t);min-height:44px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--border2);border-color:var(--text3)}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 10px;font-size:13px;min-height:36px}
.btn-xs{padding:3px 8px;font-size:11px;min-height:26px;border-radius:4px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-outline-danger{color:var(--danger);border-color:var(--danger);background:var(--danger2)}
.btn-voice{background:var(--danger2);color:var(--danger);border-color:#fca5a5;position:relative}
.btn-voice.recording{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.btn-block{display:flex;width:100%}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border:1px solid var(--border);border-radius:var(--rxs);background:var(--card);color:var(--text2);
  cursor:pointer;transition:var(--t);flex-shrink:0}
.icon-btn:hover{background:var(--border2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}

.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);
  font-size:16px;font-family:inherit;color:var(--text);background:var(--card);transition:var(--t);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge-p0{background:var(--danger2);color:var(--danger)}
.badge-p1{background:var(--warn2);color:#b45309}
.badge-p2{background:var(--border2);color:var(--text3)}
.badge-progress{background:var(--primary-light);color:var(--primary-dark)}
.badge-completed{background:var(--success2);color:var(--success)}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.kpi-card .kpi-val{font-size:28px;font-weight:800;line-height:1.2}
.kpi-card .kpi-label{font-size:11px;color:var(--text3);margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.chart-box .chart-ttl{font-size:13px;font-weight:600;margin-bottom:8px}

.date-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

.issue-card{border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:8px;transition:var(--t)}
.issue-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow2)}
.issue-card .ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.issue-card .ic-store{font-weight:700;font-size:14px}
.issue-card .ic-desc{font-size:13px;color:var(--text2);margin-bottom:6px}
.issue-card .ic-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-bottom:8px}
.issue-card .ic-actions{display:flex;gap:6px;flex-wrap:wrap}
.issue-card.overdue{border-left:3px solid var(--danger)}

.know-card{border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.know-card .kc-domain{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.know-card .kc-title{font-size:14px;font-weight:700;margin-bottom:4px}
.know-card .kc-code{font-size:11px;color:var(--text3);margin-bottom:4px}
.know-card .kc-content{font-size:13px;color:var(--text2)}

.daily-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daily-date{font-size:16px;font-weight:700}
.daily-summary{background:var(--border2);border-radius:var(--rs);padding:12px;margin-bottom:10px;font-size:13px}
.daily-item{padding:4px 0;font-size:13px;border-bottom:1px solid var(--border2);display:flex;gap:8px;align-items:flex-start}

.pwd-card{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;gap:8px}
.pwd-card .pw-info{flex:1;min-width:0}
.pwd-card .pw-name{font-weight:600;font-size:14px}
.pwd-card .pw-code{font-family:monospace;font-size:13px;color:var(--primary-dark);background:var(--primary-lighter);padding:2px 8px;border-radius:4px;letter-spacing:2px}
.pwd-card .pw-meta{font-size:12px;color:var(--text3)}
.pwd-card .pw-actions{display:flex;gap:4px;flex-shrink:0}

.search-box{position:relative;margin-bottom:12px}
.search-box input{padding-left:34px}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);width:16px;height:16px}

/* Global SVG sizing */
.btn svg,.today-ttl svg,.card-ttl svg,.daily-date svg,.voice-preview svg{width:16px;height:16px;vertical-align:middle;flex-shrink:0}
.btn-xs svg{width:12px;height:12px}

.empty{text-align:center;padding:30px 16px;color:var(--text3);font-size:14px}

.voice-preview{background:var(--warn2);border:1px dashed #fcd34d;border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;font-size:13px;color:#92400e;display:none}
.voice-preview.show{display:block}
.voice-workspace{margin-top:10px;background:#fff;border:1px solid #fecaca;border-radius:var(--rs);padding:10px}
.voice-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.voice-transcript-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--text2);margin:9px 0 5px}
.voice-transcript{width:100%;min-height:92px;resize:vertical;padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:14px;line-height:1.6;color:var(--text);background:#fff}
.voice-transcript:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.voice-status{font-size:11px;color:var(--text3);font-weight:400}
.voice-mapped{margin-top:8px;padding:7px 9px;background:var(--success2);border-radius:6px;color:#047857;font-size:12px}
.p0-panel{border:1px solid #fca5a5;background:linear-gradient(180deg,#fff 0%,var(--danger2) 100%)}
.p0-panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.p0-panel-title strong{color:#b91c1c;font-size:14px}
.p0-work-order{background:#fff;border:1px solid #fecaca;border-left:4px solid var(--danger);border-radius:var(--rs);padding:10px 11px;margin-bottom:8px}
.p0-work-order:last-child{margin-bottom:0}
.p0-work-order-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p0-work-order-shop{font-weight:700;font-size:14px}
.p0-work-order-desc{font-size:13px;color:var(--text2);margin:5px 0}
.p0-work-order-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}

.footer-actions{display:flex;gap:8px;justify-content:center;padding:16px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:16px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:var(--r);padding:24px;width:100%;max-width:420px;box-shadow:var(--shadow3)}
.modal-box h3{font-size:16px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.issue-detail-modal{max-width:720px;max-height:calc(100vh - 40px);overflow-y:auto;padding:0}
.issue-detail-header{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.issue-detail-header h3{margin:0;font-size:18px;line-height:1.35}
.issue-detail-body{padding:18px 20px 22px}
.issue-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.issue-detail-field{background:var(--border2);border-radius:var(--rxs);padding:9px 10px;min-width:0}
.issue-detail-field .idf-label{font-size:11px;color:var(--text3);margin-bottom:2px}
.issue-detail-field .idf-value{font-size:13px;font-weight:600;color:var(--text);overflow-wrap:anywhere}
.issue-detail-desc{padding:11px 12px;background:var(--primary-lighter);border-radius:var(--rs);font-size:13px;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px}
.followup-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin:15px 0 10px}
.followup-timeline{position:relative;margin-left:7px;padding-left:19px;border-left:2px solid var(--border)}
.followup-item{position:relative;padding:0 0 15px 2px}
.followup-item:last-child{padding-bottom:2px}
.followup-dot{position:absolute;left:-27px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 1px var(--primary-light)}
.followup-item.system .followup-dot{background:var(--text3);box-shadow:0 0 0 1px var(--border)}
.followup-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-bottom:3px}
.followup-content{font-size:13px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.followup-form{margin-top:16px;padding:12px;background:var(--primary-lighter);border:1px solid var(--primary-light);border-radius:var(--rs)}
.followup-form textarea{min-height:88px}
.readonly-note{margin-top:14px;padding:10px 12px;border-radius:var(--rs);background:var(--warn2);color:#92400e;font-size:12px}

.import-section{background:var(--primary-lighter);border:1px dashed var(--primary-light);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px}
.import-section .is-title{font-size:13px;font-weight:600;color:var(--primary-dark);margin-bottom:6px}
.import-section .is-desc{font-size:12px;color:var(--text2);margin-bottom:8px}
.import-info{font-size:12px;color:var(--primary-dark);margin-top:6px;background:var(--primary-light);padding:6px 10px;border-radius:4px}

@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .chart-row{grid-template-columns:1fr}
  .form-row,.form-row3{grid-template-columns:1fr}
  .nav-tab{font-size:12px;padding:10px 2px}
  .main-content{padding:12px 10px}
  .login-card{padding:24px 16px}
  .ti-slide{align-items:flex-start;flex-wrap:wrap}
  .ti-slide-main{flex-basis:calc(100% - 40px)}
  .voice-actions .btn{flex:1}
  .modal-mask{padding:8px;align-items:flex-end}
  .issue-detail-modal{max-height:92vh;border-radius:16px 16px 0 0}
  .issue-detail-header{padding:15px 14px 12px}
  .issue-detail-body{padding:14px}
  .issue-detail-grid{grid-template-columns:1fr 1fr}
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #app{padding-bottom:env(safe-area-inset-bottom)}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

function emptyUserData(){return {issues:[],knowledge:[],archives:[],dailySupps:{}}}
function cloneJson(value){
  if(value===undefined)return undefined;
  return JSON.parse(JSON.stringify(value));
}
function normalizeUserData(d){
  d=d||{};
  var issues=Array.isArray(d.issues)?d.issues.filter(function(item){return item&&typeof item==='object'}).map(function(issue){
    if(!Array.isArray(issue.followUps)) issue.followUps=[];
    return issue;
  }):[];
  var archives=Array.isArray(d.archives)?d.archives.filter(function(item){return item&&typeof item==='object'}):[];
  // 兼容旧版归档：旧数据没有 sourceIssueId，按门店、问题和创建日期做一次一对一关联。
  var linkedIssueIds={};
  archives.forEach(function(item){if(item.sourceIssueId!==undefined&&item.sourceIssueId!==null)linkedIssueIds[String(item.sourceIssueId)]=true});
  archives.forEach(function(item){
    if(item.sourceIssueId!==undefined&&item.sourceIssueId!==null)return;
    var archiveCreated=String(item.originalCreatedAt||item.createdAt||'');
    var candidates=issues.filter(function(issue){
      if(linkedIssueIds[String(issue.id)])return false;
      if(issue.progress!=='已完结')return false;
      if(String(issue.shopName||'')!==String(item.shopName||''))return false;
      if(item.shopDesc!==undefined&&String(issue.shopDesc||'')!==String(item.shopDesc||''))return false;
      if(item.priority!==undefined&&safePriority(issue.priority)!==safePriority(item.priority))return false;
      return !archiveCreated||!issue.createdAt||String(issue.createdAt)===archiveCreated;
    });
    if(candidates.length===1){item.sourceIssueId=candidates[0].id;linkedIssueIds[String(candidates[0].id)]=true}
  });
  return {issues:issues,knowledge:Array.isArray(d.knowledge)?d.knowledge:[],archives:archives,dailySupps:d.dailySupps&&typeof d.dailySupps==='object'?d.dailySupps:{}};
}
function jsonEqual(a,b){
  try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}
}
function mergeFollowUps(baseList,localList,remoteList){
  baseList=Array.isArray(baseList)?baseList:[];
  localList=Array.isArray(localList)?localList:[];
  remoteList=Array.isArray(remoteList)?remoteList:[];
  var baseMap={},localMap={},remoteMap={};
  baseList.forEach(function(item){if(item&&item.id!==undefined)baseMap[String(item.id)]=item});
  localList.forEach(function(item){if(item&&item.id!==undefined)localMap[String(item.id)]=item});
  remoteList.forEach(function(item){if(item&&item.id!==undefined)remoteMap[String(item.id)]=cloneJson(item)});
  localList.forEach(function(item){
    if(!item||item.id===undefined)return;
    var id=String(item.id),base=baseMap[id];
    if(!base||!jsonEqual(item,base))remoteMap[id]=cloneJson(item);
  });
  var seen={};
  return remoteList.concat(localList).filter(function(item){
    if(!item||item.id===undefined)return false;
    var id=String(item.id);if(seen[id])return false;seen[id]=true;return !!remoteMap[id];
  }).map(function(item){return remoteMap[String(item.id)]});
}
function mergeRecord(base,local,remote,kind,conflicts,recordKey){
  if(!remote)return cloneJson(local);
  if(!base){
    var added=Object.assign({},cloneJson(remote),cloneJson(local));
    if(kind==='issues')added.followUps=mergeFollowUps([],local.followUps,remote.followUps);
    return added;
  }
  var merged=cloneJson(remote);
  Object.keys(local||{}).forEach(function(key){
    if(key==='followUps'&&kind==='issues'){
      merged.followUps=mergeFollowUps(base.followUps,local.followUps,remote.followUps);
    }else if(!jsonEqual(local[key],base[key])){
      if(kind==='issues'&&['shopName','shopDesc','priority','deadline','progress'].indexOf(key)>=0&&
        Object.prototype.hasOwnProperty.call(remote,key)&&!jsonEqual(remote[key],base[key])&&!jsonEqual(remote[key],local[key])){
        if(conflicts)conflicts.push({type:'field_conflict',collection:kind,key:recordKey,field:key});
      }
      merged[key]=cloneJson(local[key]);
    }
  });
  return merged;
}
function collectionKey(item,kind){
  if(!item||typeof item!=='object')return '';
  if(kind==='archives'&&item.sourceIssueId!==undefined&&item.sourceIssueId!==null)return 'source:'+String(item.sourceIssueId);
  return item.id===undefined?'':'id:'+String(item.id);
}
function mergeCollection(baseList,localList,remoteList,kind,conflicts){
  baseList=Array.isArray(baseList)?baseList:[];
  localList=Array.isArray(localList)?localList:[];
  remoteList=Array.isArray(remoteList)?remoteList:[];
  var baseMap={},localMap={},resultMap={};
  baseList.forEach(function(item){var key=collectionKey(item,kind);if(key)baseMap[key]=item});
  localList.forEach(function(item){var key=collectionKey(item,kind);if(key)localMap[key]=item});
  remoteList.forEach(function(item){var key=collectionKey(item,kind);if(key)resultMap[key]=cloneJson(item)});
  Object.keys(baseMap).forEach(function(key){
    if(Object.prototype.hasOwnProperty.call(localMap,key))return;
    if(resultMap[key]&&!jsonEqual(resultMap[key],baseMap[key])){
      if(conflicts)conflicts.push({type:'delete_conflict',collection:kind,key:key});
      return;
    }
    delete resultMap[key];
  });
  localList.forEach(function(item){
    var key=collectionKey(item,kind);if(!key)return;
    var base=baseMap[key],remote=resultMap[key];
    if(base&&!remote&&!jsonEqual(item,base)){
      if(kind==='issues'){
        var baseHistoryMap={};
        getIssueFollowUps(base).forEach(function(history){baseHistoryMap[String(history.id)]=history});
        var hasNewHistory=getIssueFollowUps(item).some(function(history){
          var previous=baseHistoryMap[String(history.id)];
          return !previous||!jsonEqual(history,previous);
        });
        if(hasNewHistory){
          resultMap[key]=cloneJson(item);
          if(conflicts)conflicts.push({type:'remote_delete_overridden_by_followup',collection:kind,key:key});
          return;
        }
      }
      if(conflicts)conflicts.push({type:'update_after_remote_delete',collection:kind,key:key});
      return;
    }
    if(!base||!jsonEqual(item,base))resultMap[key]=mergeRecord(base,item,remote,kind,conflicts,key);
  });
  var seen={};
  return localList.concat(remoteList).filter(function(item){
    var key=collectionKey(item,kind);if(!key||seen[key]||!resultMap[key])return false;seen[key]=true;return true;
  }).map(function(item){return resultMap[collectionKey(item,kind)]});
}
function mergeDailySupps(base,local,remote){
  base=base&&typeof base==='object'?base:{};
  local=local&&typeof local==='object'?local:{};
  remote=remote&&typeof remote==='object'?cloneJson(remote):{};
  Object.keys(base).forEach(function(key){
    if(!Object.prototype.hasOwnProperty.call(local,key))delete remote[key];
  });
  Object.keys(local).forEach(function(key){
    if(!Object.prototype.hasOwnProperty.call(base,key)||!jsonEqual(local[key],base[key]))remote[key]=cloneJson(local[key]);
  });
  return remote;
}
function mergeUserData(base,local,remote,conflicts){
  base=normalizeUserData(cloneJson(base||emptyUserData()));
  local=normalizeUserData(cloneJson(local||emptyUserData()));
  remote=normalizeUserData(cloneJson(remote||emptyUserData()));
  var mergedIssues=mergeCollection(base.issues,local.issues,remote.issues,'issues',conflicts);
  var mergedArchives=mergeCollection(base.archives,local.archives,remote.archives,'archives',conflicts);
  var issueMap={};
  mergedIssues.forEach(function(issue){issueMap[String(issue.id)]=issue});
  mergedArchives=mergedArchives.filter(function(archive){
    if(archive.sourceIssueId===undefined||archive.sourceIssueId===null)return true;
    var issue=issueMap[String(archive.sourceIssueId)];
    if(!issue)return true;
    if(issue.progress!=='已完结')return false;
    archive.shopName=issue.shopName;archive.shopDesc=issue.shopDesc;archive.priority=issue.priority;
    archive.createdAt=issue.createdAt||archive.createdAt||'';
    archive.followUps=getIssueFollowUps(issue).slice();
    return true;
  });
  var archiveByIssue={};
  mergedArchives.forEach(function(archive){
    if(archive.sourceIssueId!==undefined&&archive.sourceIssueId!==null)archiveByIssue[String(archive.sourceIssueId)]=archive;
  });
  mergedIssues.forEach(function(issue){
    if(issue.progress!=='已完结'||archiveByIssue[String(issue.id)])return;
    var historic=remote.archives.concat(base.archives).find(function(item){return String(item.sourceIssueId)===String(issue.id)});
    var completionHistory=getIssueFollowUps(issue).filter(function(item){return item.toProgress==='已完结'&&item.createdAt}).sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))});
    var completionDate='';
    if(completionHistory.length){
      var completionTime=new Date(completionHistory[0].createdAt);
      if(!isNaN(completionTime.getTime()))completionDate=completionTime.getFullYear()+'-'+S(completionTime.getMonth()+1)+'-'+S(completionTime.getDate());
    }
    var archive=historic?cloneJson(historic):{id:gid(),completedAt:completionDate||ts()};
    archive.sourceIssueId=issue.id;archive.shopName=issue.shopName;archive.shopDesc=issue.shopDesc;
    archive.priority=issue.priority;archive.createdAt=issue.createdAt||archive.createdAt||'';
    archive.followUps=getIssueFollowUps(issue).slice();
    mergedArchives.unshift(archive);archiveByIssue[String(issue.id)]=archive;
  });
  return {
    issues:mergedIssues,
    knowledge:mergeCollection(base.knowledge,local.knowledge,remote.knowledge,'knowledge',conflicts),
    archives:mergedArchives,
    dailySupps:mergeDailySupps(base.dailySupps,local.dailySupps,remote.dailySupps)
  };
}

async function usernameToEmail(username){
  var normalized=username.trim().toLowerCase();
  var bytes=new TextEncoder().encode(normalized);
  if(window.crypto&&window.crypto.subtle){
    var digest=await window.crypto.subtle.digest('SHA-256',bytes);
    var hex=Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
    return 'u'+hex.slice(0,40)+'@syb-workbench.local';
  }
  var h=2166136261;
  for(var i=0;i<bytes.length;i++){h^=bytes[i];h=Math.imul(h,16777619)}
  return 'u'+(h>>>0).toString(16)+'@syb-workbench.local';
}

async function loadUserData(){
  if(!db||!STATE.user) return;
  var userId=STATE.user.userId;
  var nextData=emptyUserData(),nextRevision='';
  var result=await db.from('workbench_data').select('payload,updated_at').eq('user_id',userId).maybeSingle();
  if(result.error) throw result.error;
  if(result.data&&result.data.payload){
    nextData=normalizeUserData(result.data.payload);
    nextRevision=result.data.updated_at||'';
  }else{
    var created=await db.from('workbench_data').upsert({user_id:userId,payload:nextData},{onConflict:'user_id'}).select('payload,updated_at').single();
    if(created.error) throw created.error;
    nextData=normalizeUserData(created.data.payload);
    nextRevision=created.data.updated_at||'';
  }
  if(!STATE.user||STATE.user.userId!==userId)return;
  STATE.data=nextData;
  cloudBaseline=cloneJson(nextData);
  cloudRevision=nextRevision;
}
function saveUserData(){
  if(!db||!STATE.user) return Promise.resolve(false);
  var userId=STATE.user.userId;
  var snapshot=cloneJson(normalizeUserData(STATE.data));
  var baseSnapshot=cloneJson(normalizeUserData(cloudBaseline));
  var requestId=++latestSaveRequest;
  pendingSaves++;
  setCloudStatus('正在保存…','var(--warning)');
  var task=saveQueue.catch(function(){}).then(async function(){
    for(var attempt=0;attempt<5;attempt++){
      var current=await db.from('workbench_data').select('payload,updated_at').eq('user_id',userId).maybeSingle();
      if(current.error) throw current.error;
      if(!current.data){
        var inserted=await db.from('workbench_data').insert({user_id:userId,payload:snapshot}).select('payload,updated_at').maybeSingle();
        if(!inserted.error&&inserted.data)return {payload:normalizeUserData(inserted.data.payload),updated_at:inserted.data.updated_at||''};
        if(inserted.error&&inserted.error.code!=='23505')throw inserted.error;
        continue;
      }
      var remote=normalizeUserData(current.data.payload);
      var conflicts=[];
      var merged=mergeUserData(baseSnapshot,snapshot,remote,conflicts);
      var updated=await db.from('workbench_data').update({payload:merged})
        .eq('user_id',userId).eq('updated_at',current.data.updated_at)
        .select('payload,updated_at').maybeSingle();
      if(updated.error) throw updated.error;
      if(updated.data)return {payload:normalizeUserData(updated.data.payload),updated_at:updated.data.updated_at||'',conflicts:conflicts};
      await new Promise(function(resolve){setTimeout(resolve,60*(attempt+1))});
    }
    throw new Error('检测到多设备同时保存，自动合并重试仍未成功');
  });
  saveQueue=task.catch(function(){});
  return task.then(function(saved){
    pendingSaves=Math.max(0,pendingSaves-1);
    if(STATE.user&&STATE.user.userId===userId){
      var formDraft=captureIssueFormDraft();
      var beforeMerge=dataSignature(STATE.data);
      STATE.data=mergeUserData(snapshot,STATE.data,saved.payload);
      cloudBaseline=cloneJson(saved.payload);
      cloudRevision=saved.updated_at||'';
      if(beforeMerge!==dataSignature(STATE.data)){
        renderApp();
        restoreIssueFormDraft(formDraft);
      }
    }
    if(saved.conflicts&&saved.conflicts.length){
      setCloudStatus('已同步，并保留另一设备的新记录','var(--warning)');
    }else if(requestId===latestSaveRequest&&pendingSaves===0){setCloudStatus('已实时同步','var(--success)')}
    return {ok:true,conflicts:saved.conflicts||[]};
  }).catch(function(error){
    pendingSaves=Math.max(0,pendingSaves-1);
    console.error('[商云宝] 云端保存失败',error);
    setCloudStatus('云端保存失败','var(--danger)');
    T('云端保存失败，请检查网络后重试');
    return false;
  });
}

function restoreIssueFormDraft(draft){

function scheduleRealtimeRefresh(){
  clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(function(){
    // 正在输入时短暂延后，最多约 1.5 秒，避免一直聚焦导致永远不同步。
    if(hasActiveFormInput()&&realtimeDeferCount<4){
      realtimeDeferCount++;
      scheduleRealtimeRefresh();
      return;
    }
    realtimeDeferCount=0;
    refreshFromCloud({source:'realtime'});
  },350);
}
async function refreshFromCloud(options){
  options=options||{};
  if(!db||!STATE.user) return false;
  if(isRefreshingCloud){refreshQueued=true;return false}
  isRefreshingCloud=true;
  try{
    if(pendingSaves>0){
      await saveQueue.catch(function(){});
      // 让发起保存的操作先完成成功收尾或失败回滚，再捕获表单草稿。
      await new Promise(function(resolve){setTimeout(resolve,0)});
      if(pendingSaves>0){refreshQueued=true;return false}
    }
    if(!STATE.user)return false;
    var beforeOwn=dataSignature(STATE.data);
    var beforeTeam=dataSignature(STATE.importedData);
    var editedIssueDeleted=false;
    await loadImportedData();
    await loadUserData();
    // 网络读取期间用户可能仍在输入；在真正重绘前捕获最新 DOM 草稿。
    var issueDraft=captureIssueFormDraft();
    if(STATE.editingIssueId&&!findIssue(STATE.editingIssueId).id){
      editedIssueDeleted=true;
      STATE.editingIssueId=null;
      STATE.issueFormTouched={};
      STATE.pendingNewIssue=null;
    }
    var changed=beforeOwn!==dataSignature(STATE.data)||beforeTeam!==dataSignature(STATE.importedData);
    if(changed){
      renderApp();
      restoreIssueFormDraft(issueDraft);
      if(editedIssueDeleted||!options.silent) T(editedIssueDeleted?'正在编辑的工单已被另一设备删除；内容已保留在新增表单':(options.source==='realtime'?'已收到其他设备的最新数据':'已刷新云端最新数据'));
    }
    setCloudStatus('已实时同步','var(--success)');
    return changed;
  }catch(error){
    console.error('[商云宝] 云端刷新失败',error);
    setCloudStatus('云端刷新失败','var(--danger)');
    if(!options.silent) T('刷新失败，请检查网络后重试');
    return false;
  }finally{
    isRefreshingCloud=false;
    if(refreshQueued){
      refreshQueued=false;
      scheduleRealtimeRefresh();
    }
  }
}
async function manualCloudRefresh(){
  setCloudStatus('正在刷新…','var(--warning)');
  await refreshFromCloud({source:'manual'});
}
function stopRealtimeSync(){
  clearTimeout(realtimeRefreshTimer);
  clearInterval(syncPollTimer);
  realtimeRefreshTimer=null;
  realtimeDeferCount=0;
  refreshQueued=false;
  syncPollTimer=null;
  if(realtimeChannel&&db){db.removeChannel(realtimeChannel)}
  realtimeChannel=null;
}
function startRealtimeSync(){
  stopRealtimeSync();
  if(!db||!STATE.user) return;
  var workbenchChange={event:'*',schema:'public',table:'workbench_data'};
  if(STATE.user.role!=='admin') workbenchChange.filter='user_id=eq.'+STATE.user.userId;
  realtimeChannel=db.channel('workbench-sync-'+STATE.user.userId+'-'+Date.now())
    .on('postgres_changes',workbenchChange,function(){scheduleRealtimeRefresh()})
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(){scheduleRealtimeRefresh()})
    .subscribe(function(status){
      if(status==='SUBSCRIBED') setCloudStatus('实时同步已连接','var(--success)');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setCloudStatus('云端已连接（自动刷新）','var(--warning)');
    });
  syncPollTimer=setInterval(function(){refreshFromCloud({source:'poll',silent:true})},15000);
}

async function loadImportedData(){

function filterByDate(arr){
  if(STATE.dashRange==='all') return arr;
  var start, end;
  if(STATE.dashRange==='today'){start=ts();end=ts()}
  else if(STATE.dashRange==='7d'){start=tsOffset(-6);end=ts()}
  else if(STATE.dashRange==='30d'){start=tsOffset(-29);end=ts()}
  else if(STATE.dashRange==='custom'){start=STATE.dashStart;end=STATE.dashEnd}
  return arr.filter(function(item){
    var d=item.createdAt||item.deadline||'';
    return d>=start&&d<=end;
  });
}

function dashStats(){
  var issues = getDashIssues();
  var total=issues.length;
  var open=0,inProg=0,done=0,overdue=0;
  var pt=new Date();pt.setHours(0,0,0,0);
  for(var i=0;i<issues.length;i++){
    var s=issues[i].progress||'';
    if(s==='已完结') done++;
    else if(s==='未开始'||s==='') open++;
    else if(s==='跟进中'||s==='阶段性完成') inProg++;
    if(issues[i].deadline){
      var dl=parseLocalDate(issues[i].deadline);dl.setHours(0,0,0,0);
      if(dl<pt&&s!=='已完结') overdue++;
    }
  }
  return {total:total,open:open,inProg:inProg,done:done,overdue:overdue};
}

// ====== SVG 图表 ======
function svgPie(data){
  var total=data.reduce(function(s,d){return s+d.v},0);
  if(total===0) return '<div style="color:#94a3b8;padding:30px">暂无数据</div>';
  var cx=80,cy=80,r=65,ir=40;
  var angle=0,slices='';
  for(var i=0;i<data.length;i++){
    var a=(data[i].v/total)*Math.PI*2;
    var x1=cx+r*Math.sin(angle),y1=cy-r*Math.cos(angle);
    angle+=a;
    var x2=cx+r*Math.sin(angle),y2=cy-r*Math.cos(angle);
    var la=a>Math.PI?1:0;
    slices+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+la+',1 '+x2+','+y2+' Z" fill="'+data[i].c+'"/>';
  }
  var legend='';
  for(var j=0;j<data.length;j++){
    legend+='<div style="display:inline-flex;align-items:center;gap:4px;margin:0 8px;font-size:11px">'+
      '<span style="width:10px;height:10px;border-radius:2px;background:'+data[j].c+';display:inline-block"></span>'+
      data[j].label+' '+data[j].v+'</div>';
  }
  return '<svg viewBox="0 0 160 160" style="max-width:200px"><circle cx="'+cx+'" cy="'+cy+'" r="'+ir+'" fill="#fff"/>'+slices+'</svg><div style="margin-top:6px">'+legend+'</div>';
}

function svgBar(data){
  var max=Math.max.apply(null,data.map(function(d){return d.v}));
  if(max===0) max=1;
  var w=260,h=140,barW=50,gap=30,pad=10;
  var bars='';
  for(var i=0;i<data.length;i++){
    var bh=(data[i].v/max)*(h-40);
    var bx=pad+i*(barW+gap);
    var by=h-20-bh;
    bars+='<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+data[i].c+'"/>';
    bars+='<text x="'+(bx+barW/2)+'" y="'+(by-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">'+data[i].v+'</text>';
    bars+='<text x="'+(bx+barW/2)+'" y="'+(h-4)+'" text-anchor="middle" font-size="11" fill="#64748b">'+data[i].label+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="max-width:300px">'+bars+'</svg>';
}

// ====== 未处理工单轮播（不受驾驶舱日期筛选影响） ======
function getOpenWorkItems(){
  var items=[];
  var today=new Date();today.setHours(0,0,0,0);
  var issues=getScopedIssues();
  for(var i=0;i<issues.length;i++){
    var iss=issues[i];
    if(isIssueCompleted(iss)) continue;
    var type='pending';
    if(iss.deadline){
      var dl=parseLocalDate(iss.deadline);dl.setHours(0,0,0,0);
      if(dl<today) type='overdue';
      else if(dl.getTime()===today.getTime()) type='today';
    }
    items.push({issue:iss,type:type});
  }
  var priOrder={P0:0,P1:1,P2:2};
  items.sort(function(a,b){
    var ap=priOrder[a.issue.priority]===undefined?2:priOrder[a.issue.priority];
    var bp=priOrder[b.issue.priority]===undefined?2:priOrder[b.issue.priority];
    if(ap!==bp) return ap-bp;
    if(a.type==='overdue'&&b.type!=='overdue') return -1;
    if(a.type!=='overdue'&&b.type==='overdue') return 1;
    var ad=a.issue.deadline||'9999-12-31',bd=b.issue.deadline||'9999-12-31';
    if(ad!==bd) return ad.localeCompare(bd);
    return (a.issue.createdAt||'').localeCompare(b.issue.createdAt||'');
  });
  return items;
}

function getOpenP0Issues(){
  return getOpenWorkItems().filter(function(item){return item.issue.priority==='P0'});
}

  if(!slides.length) return;
  workCarouselIndex=((index%slides.length)+slides.length)%slides.length;
  for(var i=0;i<slides.length;i++) slides[i].classList.toggle('active',i===workCarouselIndex);
  var counter=document.getElementById('ti-carousel-count');
  if(counter) counter.textContent=(workCarouselIndex+1)+' / '+slides.length;
}

    workCarouselTimer=setInterval(function(){showWorkCarouselItem(workCarouselIndex+1)},4500);

  var pass2=document.getElementById('reg-pass2').value.trim();
  var errEl=document.getElementById('reg-error');
  if(!name){errEl.textContent='请填写姓名';return}
  if(!username){errEl.textContent='请设置用户名';return}
  if(!/^[a-zA-Z0-9\u4e00-\u9fa5]+$/.test(username)){errEl.textContent='用户名只能使用字母、数字或中文';return}
  if(!pass||pass.length<6){errEl.textContent='密码至少6位';return}
  if(pass!==pass2){errEl.textContent='两次输入的密码不一致';return}
  if(!db){errEl.textContent='云端连接尚未配置';return}
  errEl.textContent='正在创建云端账号…';
  try{
    var email=await usernameToEmail(username);
    var result=await db.auth.signUp({email:email,password:pass,options:{data:{username:username,name:name,department:dept}}});
    if(result.error) throw result.error;
    if(!result.data.session){throw new Error('注册成功但尚未自动登录，请联系管理员关闭邮箱确认')}
    await startUserSession(result.data.user);
    T('注册成功，欢迎 '+name+'！');
  }catch(error){
    console.error('[商云宝] 注册失败',error);
    var msg=(error&&error.message)||'';
    errEl.textContent=(msg.indexOf('already')>=0||msg.indexOf('Database error')>=0)?'该用户名已被注册，请换一个':'注册失败：'+msg;
  }
}

async function doLogin(){
  var uname=document.getElementById('login-user').value.trim();
  var pwd=document.getElementById('login-pass').value.trim();
  if(!uname){showLogin('请输入用户名');return}
  if(!pwd){showLogin('请输入密码');return}
  if(!db){showLogin('云端连接尚未配置');return}
  try{
    var email=await usernameToEmail(uname);
    var result=await db.auth.signInWithPassword({email:email,password:pwd});
    if(result.error) throw result.error;
    await startUserSession(result.data.user);
    T('欢迎回来，数据已从云端恢复！');
  }catch(error){
    console.error('[商云宝] 登录失败',error);
    showLogin('用户名或密码错误，请检查后重试');
  }
}

function getIssueFollowUps(issue){
  if(!issue||!Array.isArray(issue.followUps)) return [];
  return issue.followUps.filter(function(item){return item&&typeof item==='object'&&typeof item.content==='string'});
}
function appendIssueHistory(issue,type,content,fromProgress,toProgress,options){
  if(!issue) return null;
  options=options||{};
  var entry={
    id:options.id||gid(),type:type||'follow_up',content:String(content||''),
    fromProgress:fromProgress||'',toProgress:toProgress||'',
    authorId:STATE.user?STATE.user.userId:'',authorName:STATE.user?STATE.user.name:'',createdAt:options.createdAt||nowIso()
  };
  issue.followUps=getIssueFollowUps(issue).slice();
  var existingIndex=issue.followUps.findIndex(function(item){return String(item.id)===String(entry.id)});
  if(existingIndex>=0)issue.followUps[existingIndex]=entry;
  else issue.followUps.push(entry);
  issue.updatedAt=entry.createdAt;
  return entry;
}
function pendingHistoryOperation(key){
  if(!pendingHistoryOps[key])pendingHistoryOps[key]={id:gid(),createdAt:nowIso()};
  return pendingHistoryOps[key];
}
function findIssueRef(ownerUserId,issueId){
  var ownId=STATE.user?STATE.user.userId:'';
  var owner=ownerUserId||ownId;
  if(owner===ownId){
    var own=findIssue(issueId);
    return own&&own.id?{issue:own,ownerUserId:ownId,ownerName:STATE.user.name,ownerDept:STATE.user.department||'',readOnly:false}:null;
  }
  if(!STATE.user||STATE.user.role!=='admin') return null;
  var member=STATE.importedData[owner];
  if(!member||!member.data||!Array.isArray(member.data.issues)) return null;
  var issue=member.data.issues.find(function(item){return String(item.id)===String(issueId)});
  return issue?{issue:issue,ownerUserId:owner,ownerName:member.name||'未知成员',ownerDept:member.department||'',readOnly:true}:null;
}

async function addIssueFollowUp(){
  var detail=STATE.issueDetail;
  if(!detail||detail.saving) return;
  if(!canStartMutation())return;
  var ref=findIssueRef(detail.ownerUserId,detail.issueId);
  if(!ref&&STATE.user&&STATE.user.role!=='admin') ref=findIssueRef(STATE.user.userId,detail.issueId);
  if(!ref){T('工单已被删除或刚刚发生同步变化，请重新打开详情');return}
  if(ref.readOnly){T('团队成员工单仅支持查看');return}
  var input=document.getElementById('followup-content');
  var progressEl=document.getElementById('followup-progress');
  var content=(input?input.value:detail.draftContent||'').trim();
  if(!content){T('请填写本次跟进内容');if(input)input.focus();return}
  var issue=ref.issue;
  var nextProgress=progressEl?progressEl.value:(detail.draftProgress||issue.progress||'未开始');
  var oldProgress=issue.progress||'未开始';
  var before=JSON.parse(JSON.stringify(STATE.data));
  detail.saving=true;
  var saveBtn=document.getElementById('followup-save-btn');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='正在保存…'}
  if(!detail.pendingHistoryId){detail.pendingHistoryId=gid();detail.pendingHistoryCreatedAt=nowIso()}
  appendIssueHistory(issue,'follow_up',content,oldProgress,nextProgress,{id:detail.pendingHistoryId,createdAt:detail.pendingHistoryCreatedAt});
  issue.progress=nextProgress;
  if(oldProgress!=='已完结'&&nextProgress==='已完结') archiveIssue(issue);
  if(oldProgress==='已完结'&&nextProgress!=='已完结') STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(issue.id)});
  var ok=await saveUserData();
  if(!ok){
    STATE.data=before;
    detail.saving=false;
    renderApp();
    T('跟进记录未保存，内容已保留，请重试');
    return;
  }
  if(ok.conflicts&&ok.conflicts.some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'})){
    detail.saving=false;detail.pendingHistoryId='';detail.pendingHistoryCreatedAt='';
    T('该工单已在另一设备删除，本次跟进未写入');
    return;
  }
  var followUpFieldConflict=(ok.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
  var followUpDeleteConflict=(ok.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
  detail.draftContent='';detail.draftProgress=nextProgress;detail.draftProgressTouched=false;detail.saving=false;
  detail.pendingHistoryId='';detail.pendingHistoryCreatedAt='';
  renderApp();
  T(followUpDeleteConflict?'跟进已保存；另一设备曾删除此工单，因有新跟进已自动保留工单':(followUpFieldConflict?'跟进已保存；另一设备也修改了同一字段，当前以本次保存为准，请核对':'跟进记录已同步云端'));
}

  h+='</div>';

  document.getElementById('app').innerHTML = h;
  startWorkCarousel();
  if(STATE.issueDetail) renderIssueDetailModal();

  // Backup reminder
  var totalCount = STATE.data.issues.length + STATE.data.archives.length;
  if(totalCount>=30){
    var todayBar=document.querySelector('.today-bar');
    if(todayBar){
      var reminder=document.createElement('div');
      reminder.style.cssText='font-size:12px;color:#b45309;margin-top:6px;text-align:center';
      reminder.textContent='数据已积累'+totalCount+'条，建议导出备份';
      todayBar.appendChild(reminder);
    }
  }
}

function renderTodayBar(){

    STATE.pendingNewIssue={issueId:gid(),createdAt:ts(),historyId:gid(),historyCreatedAt:nowIso()};
  }
  var pending=STATE.pendingNewIssue;
  var issue=findIssue(pending.issueId);
  var existed=!!issue.id;
  var wasDone=existed&&issue.progress==='已完结';
  if(!existed){issue={id:pending.issueId,createdAt:pending.createdAt,followUps:[]};STATE.data.issues.unshift(issue)}
  issue.shopName=shop;issue.shopDesc=desc;issue.priority=pri;issue.deadline=dl;issue.progress=prog;
  appendIssueHistory(issue,'created','创建工单，初始状态：'+prog,'',prog,{id:pending.historyId,createdAt:pending.historyCreatedAt});
  if(existed)issue.updatedAt=nowIso();
  STATE.voiceParsed = {shop:'', desc:'', pri:'P2', deadline:''};
  STATE.voiceDetected = {shop:'', desc:'', pri:'', deadline:''};
  STATE.voiceText = '';
  STATE.voiceParsedReady = false;
  STATE.voiceMissing = [];
  STATE.issueFormTouched={};
  if(!wasDone&&prog==='已完结') archiveIssue(issue);
  if(wasDone&&prog!=='已完结')STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(issue.id)});
  var saving=saveUserData();
  renderApp();
  var saved=await saving;
  if(saved&&!(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'})){
    var newIssueFieldConflict=(saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
    STATE.pendingNewIssue=null;T(newIssueFieldConflict?'工单已保存；另一设备也修改了同一字段，请核对当前结果':'问题已添加并同步云端');return
  }
  if(!saved)STATE.data=before;
  STATE.voiceText=formDraft?formDraft.transcript:'';
  renderApp();
  restoreIssueFormDraft(formDraft);
  T(saved?'同一工单已在另一设备删除，表单内容已保留':'问题未同步，已保留表单内容，请重试');
}
async function updateIssue(){
  var id=STATE.editingIssueId;
  if(!id) return;
  if(!canStartMutation())return;
  var iss=findIssue(id);
  if(!iss||!iss.id){
    var removedDraft=captureIssueFormDraft();
    STATE.editingIssueId=null;STATE.issueFormTouched={};STATE.pendingNewIssue=null;
    STATE.voiceText=removedDraft?removedDraft.transcript:'';
    renderApp();restoreIssueFormDraft(Object.assign({},removedDraft||{}, {editingIssueId:null}));
    T('该工单已被另一设备删除；您的编辑内容已保留在新增表单');
    return;
  }
  var before=JSON.parse(JSON.stringify(STATE.data));
  var oldProgress=iss.progress||'未开始';
  var wasDone=oldProgress==='已完结';
  var nextShopName=document.getElementById('iss-shop').value.trim();
  if(!nextShopName){T('请填写门店名称');return}
  var formDraft=captureIssueFormDraft();
  iss.shopName=nextShopName;
  iss.shopDesc=document.getElementById('iss-desc').value.trim();
  iss.priority=document.getElementById('iss-pri').value;
  iss.deadline=document.getElementById('iss-deadline').value;
  iss.progress=document.getElementById('iss-progress').value;
  iss.updatedAt=nowIso();
  var historyKey='',historyOp=null;
  if(oldProgress!==iss.progress){
    historyKey='update:'+String(id)+':'+oldProgress+'>'+iss.progress;
    historyOp=pendingHistoryOperation(historyKey);
    appendIssueHistory(iss,'status_change','推进状态由“'+oldProgress+'”变更为“'+iss.progress+'”',oldProgress,iss.progress,historyOp);
  }
  if(!wasDone&&iss.progress==='已完结') archiveIssue(iss);
  if(wasDone&&iss.progress!== '已完结') STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(iss.id)});
  STATE.editingIssueId=null;
  STATE.issueFormTouched={};
  var saving=saveUserData();
  renderApp();
  var saved=await saving;
  if(saved){
    if(historyKey)delete pendingHistoryOps[historyKey];
    var remotelyDeleted=(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'});
    if(remotelyDeleted){
      STATE.editingIssueId=null;STATE.pendingNewIssue=null;STATE.voiceText=formDraft?formDraft.transcript:'';
      var recoveryDraft=Object.assign({},formDraft||{}, {editingIssueId:null});
      renderApp();restoreIssueFormDraft(recoveryDraft);
      T('该工单已在另一设备删除；您的编辑内容已保留在新增表单');
      return;
    }
    var updateDeleteConflict=(saved.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
    T(updateDeleteConflict?'修改已保存；另一设备曾删除此工单，因包含新状态记录已自动保留':((saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'})?'修改已保存；另一设备也修改了同一字段，当前以本次保存为准，请核对':'修改已同步云端'));
  }else{
    STATE.data=before;STATE.editingIssueId=id;STATE.issueFormTouched=Object.assign({},formDraft&&formDraft.touched||{});
    renderApp();restoreIssueFormDraft(formDraft);T('修改未同步，已保留编辑内容，请重试');
  }
}
function editIssue(id){

}
async function changeProgress(id, prog){
  var iss=findIssue(id);
  if(!iss||!iss.id) return;
  var oldProgress=iss.progress||'未开始';
  if(oldProgress===prog) return;
  if(!canStartMutation()){renderApp();return}
  var before=JSON.parse(JSON.stringify(STATE.data));
  var wasDone=oldProgress==='已完结';
  iss.progress=prog;
  var historyKey='progress:'+String(id)+':'+oldProgress+'>'+prog;
  var historyOp=pendingHistoryOperation(historyKey);
  appendIssueHistory(iss,'status_change','推进状态由“'+oldProgress+'”变更为“'+prog+'”',oldProgress,prog,historyOp);
  if(!wasDone&&prog==='已完结') archiveIssue(iss);
  if(wasDone&&prog!=='已完结') STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(iss.id)});
  var saving=saveUserData();
  renderApp();
  var saved=await saving;
  if(saved){
    delete pendingHistoryOps[historyKey];
    var progressDeleted=(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'});
    var progressConflict=(saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
    var progressDeleteConflict=(saved.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
    T(progressDeleted?'该工单已在另一设备删除，本次进度未写入':(progressDeleteConflict?'进度已保存；另一设备曾删除此工单，因有新状态记录已自动保留':(progressConflict?'进度已保存；另一设备也修改了进度，当前以本次保存为准，请核对':'进度已更新并同步')));
  }
  else{STATE.data=before;renderApp();T('进度未同步，已恢复原状态')}
}
async function deleteIssue(id){
  if(!canStartMutation())return;
  if(!confirm('确定删除此问题？')) return;
  var before=cloneJson(STATE.data);
  STATE.data.issues=STATE.data.issues.filter(function(i){return String(i.id)!==String(id)});
  STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(id)});
  if(STATE.issueDetail&&STATE.issueDetail.ownerUserId===STATE.user.userId&&STATE.issueDetail.issueId===String(id))STATE.issueDetail=null;
  var saving=saveUserData();
  renderApp();
  var saved=await saving;
  if(!saved){STATE.data=before;renderApp();T('删除未同步，工单已恢复，请重试');return}
  T(saved.conflicts&&saved.conflicts.length?'另一设备刚更新了此工单；为保护最新跟进，本次未删除':'已删除并同步云端');
}
function archiveIssue(issue){
  var existing=STATE.data.archives.find(function(item){return String(item.sourceIssueId)===String(issue.id)});
  var snapshot={sourceIssueId:issue.id,shopName:issue.shopName,shopDesc:issue.shopDesc,priority:issue.priority,completedAt:ts(),createdAt:issue.createdAt||'',followUps:getIssueFollowUps(issue).slice()};
  if(existing){
    Object.keys(snapshot).forEach(function(key){existing[key]=snapshot[key]});
    return;
  }
  snapshot.id=gid();
  STATE.data.archives.unshift(snapshot);
  T(issue.shopName+' 已归档');
}

// ====== 语音录入 ======
var recognition=null;
var isRecognizing=false;
var voiceSessionBase='';
var voiceLastError='';
var voiceSessionId=0;

function stopVoiceRecognition(silent){
  voiceSessionId++;
  if(recognition&&isRecognizing){
    try{recognition.abort()}catch(e){}
  }
  isRecognizing=false;
  voiceLastError='';
  if(!silent) setVoiceUi(false,'录音','录音已停止，可修改文字');
}

function setVoiceUi(recording,label,status){
  var btn=document.getElementById('voice-btn');
  if(btn) btn.classList.toggle('recording',!!recording);
  var labelEl=document.getElementById('voice-btn-label');
  if(labelEl) labelEl.textContent=label||'录音';
  var statusEl=document.getElementById('voice-status');
  if(statusEl&&status) statusEl.textContent=status;
  var transcript=document.getElementById('voice-transcript');
  if(transcript) transcript.readOnly=!!recording;
}

function updateVoiceText(value){
  STATE.voiceText=value;
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var mapped=document.querySelectorAll('.voice-mapped');
  for(var i=0;i<mapped.length;i++) mapped[i].style.display='none';
  var statusEl=document.getElementById('voice-status');
  if(statusEl&&!isRecognizing) statusEl.textContent='文字已修改，请点击“识别并填入”';
}

function writeVoiceTranscript(value){
  STATE.voiceText=value;
  var transcript=document.getElementById('voice-transcript');
  if(transcript){
    transcript.value=value;
    transcript.scrollTop=transcript.scrollHeight;
  }
}

function clearVoiceTranscript(){
  stopVoiceRecognition(true);
  STATE.voiceText='';
  STATE.voiceDetected={shop:'',desc:'',pri:'',deadline:''};
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var transcript=document.getElementById('voice-transcript');
  if(transcript) transcript.value='';
  var mapped=document.querySelectorAll('.voice-mapped');
  for(var i=0;i<mapped.length;i++) mapped[i].style.display='none';
  setVoiceUi(false,'录音','等待录音，或直接输入文字');
}

function startVoice(){
  var hasSR = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
  if(!hasSR){
    T('当前浏览器不支持语音识别。请使用 Chrome/Edge 浏览器打开此页面，或手动填写表单');
    setVoiceUi(false,'录音','当前浏览器不支持麦克风转写，可直接输入文字');
    return;
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(isRecognizing && recognition){
    try{ recognition.stop(); }catch(e){}
    setVoiceUi(false,'整理中...','正在整理最后一段文字...');
    var pendingTranscript=document.getElementById('voice-transcript');
    if(pendingTranscript) pendingTranscript.readOnly=true;
    return;
  }

  try{ if(recognition) recognition.abort(); }catch(e){}
  var transcript=document.getElementById('voice-transcript');
  STATE.voiceText=transcript?transcript.value.trim():STATE.voiceText.trim();
  voiceSessionBase=STATE.voiceText;
  recognition = new SR();
  var activeVoiceSession=++voiceSessionId;
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.continuous = true;

  recognition.onstart = function(){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = true;
    voiceLastError='';
    setVoiceUi(true,'停止','正在录音并实时转写...');
    T('正在聆听，请说出门店信息和问题...');
  };

  recognition.onresult = function(e){
    if(activeVoiceSession!==voiceSessionId) return;
    var finalText='',interimText='';
    for(var i=0; i<e.results.length; i++){
      var segment=e.results[i][0].transcript||'';
      if(e.results[i].isFinal) finalText+=segment;
      else interimText+=segment;
    }
    var current=(voiceSessionBase?voiceSessionBase+' ':'')+finalText+interimText;
    writeVoiceTranscript(current.trim());
    setVoiceUi(true,'停止',interimText?'正在实时转写...':'已记录，继续说或点击停止');
  };

  recognition.onerror = function(e){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = false;
    var msg = '语音识别出错';
    if(e.error === 'not-allowed') msg = '麦克风权限被拒绝，请在浏览器设置中允许麦克风访问';
    else if(e.error === 'no-speech') msg = '未检测到语音，请靠近麦克风再试一次';
    else if(e.error === 'network') msg = '网络连接异常，语音识别需要联网';
    else if(e.error === 'aborted') return;
    else msg = '语音识别失败：' + e.error;
    voiceLastError=msg;
    setVoiceUi(false,'录音',msg);
    T(msg);
  };

  recognition.onend = function(){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = false;
    setVoiceUi(false,'录音',voiceLastError||(STATE.voiceText?'录音已结束，可修改文字后识别':'未识别到文字，可重新录音'));
  };

  try{
    recognition.start();
  }catch(e){
    T('启动语音识别失败，请刷新页面后重试');
    isRecognizing = false;
    setVoiceUi(false,'录音','启动失败，请刷新页面后重试');
  }
}

function validVoiceDate(year,month,day){
  var d=new Date(year,month-1,day);
  return d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day;
}
function voiceDateText(year,month,day){
  return validVoiceDate(year,month,day)?year+'-'+S(month)+'-'+S(day):'';
}
function parseVoiceDeadline(text){
  var now=new Date(),year=now.getFullYear(),m;
  m=text.match(/(20\d{2})\s*(?:年|[-\/.])\s*(\d{1,2})\s*(?:月|[-\/.])\s*(\d{1,2})\s*[日号]?/);
  if(m) return voiceDateText(parseInt(m[1]),parseInt(m[2]),parseInt(m[3]));
  if(/大后天/.test(text)) return tsOffset(3);
  if(/后天/.test(text)) return tsOffset(2);
  if(/明天|明日/.test(text)) return tsOffset(1);
  if(/今天|今日/.test(text)) return ts();
  m=text.match(/(\d{1,2})\s*天后/);
  if(m) return tsOffset(parseInt(m[1]));
  m=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if(m) return voiceDateText(year,parseInt(m[1]),parseInt(m[2]));
  m=text.match(/(?:本周|下周|周|星期)([一二三四五六日天])/);
  if(m){
    var weekMap={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0};
    var target=weekMap[m[1]],currentDay=now.getDay()||7,targetDay=target||7;
    var diff=/下周/.test(m[0])?(7-currentDay+targetDay):(targetDay-currentDay);
    if(diff<0) diff+=7;
    var wd=new Date(now);wd.setDate(now.getDate()+diff);
    return wd.getFullYear()+'-'+S(wd.getMonth()+1)+'-'+S(wd.getDate());
  }
  return '';
}

function escapeVoiceRegExp(text){return text.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function parseVoiceText(text){
  var normalized=String(text||'').replace(/\s+/g,' ').trim();
  var shop='',desc='',pri='',deadline=parseVoiceDeadline(normalized);

  var explicitGrades=[];
  if(/[Pp]\s*0|P零/.test(normalized)) explicitGrades.push('P0');
  if(/[Pp]\s*1|P一/.test(normalized)) explicitGrades.push('P1');
  if(/[Pp]\s*2|P二/.test(normalized)) explicitGrades.push('P2');
  if(explicitGrades.length===1) pri=explicitGrades[0];
  else if(explicitGrades.length===0){
    if(/最高优先级|特急|紧急(?!程度)/.test(normalized)) pri='P0';
    else if(/高优先级|重要|尽快处理/.test(normalized)) pri='P1';
    else if(/低优先级|普通|一般/.test(normalized)) pri='P2';
    else if(/无法营业|全店(?:瘫痪|不可用)|系统(?:完全)?(?:瘫痪|不可用)/.test(normalized)) pri='P0';
    else if(/部分功能不可用|明显影响营业/.test(normalized)) pri='P1';
    else if(/咨询|培训|优化建议/.test(normalized)) pri='P2';
  }

  var shopMatch=normalized.match(/(?:门店名称|店名|门店)\s*(?:是|为|叫|[:：])?\s*([^，,。；;]{2,40})/);
  if(shopMatch){
    shop=shopMatch[1].split(/(?:门店问题|问题描述|问题|故障|异常|情况|优先级|紧急程度|截止)/)[0].trim();
  }
  if(!shop){
    shopMatch=normalized.match(/^([^，,。；;]{2,40}?(?:门店|店|球房|台球厅|俱乐部))(?=[，,。；;\s]|$)/);
    if(shopMatch) shop=shopMatch[1].trim();
  }

  var descMatch=normalized.match(/(?:门店问题|问题描述|问题|故障|异常|情况)\s*(?:是|为|有|[:：])?\s*(.+)/);
  if(descMatch) desc=descMatch[1];
  else desc=normalized;
  desc=desc.replace(/[，,。；;]?\s*(?:优先级|紧急程度)\s*(?:是|为|[:：])?\s*(?:[Pp]\s*[012]|P[零一二]|最高优先级|高优先级|低优先级|紧急|重要|普通)[\s\S]*$/,'');
  desc=desc.replace(/[，,。；;]?\s*(?:[Pp]\s*[012]|P[零一二])\s*(?:紧急|重要|普通)?[\s\S]*$/,'');
  desc=desc.replace(/[，,。；;]?\s*(?:截止(?:日期|时间)?|要求|计划)\s*(?:是|为|[:：])?[\s\S]*$/,'');
  if(!descMatch&&shop){
    desc=desc.replace(new RegExp('^(?:门店名称|店名|门店)?\\s*(?:是|为|叫|[:：])?\\s*'+escapeVoiceRegExp(shop)),'');
  }
  desc=desc.replace(/^\s*[，,。；;]?\s*(?:门店问题|问题描述|问题|故障|异常|情况)?\s*(?:是|为|有|[:：])?\s*/,'').replace(/[，,。；;\s]+$/,'').trim();
  if(desc===shop) desc='';

  var missing=[];
  if(!shop) missing.push('门店名称');
  if(!desc) missing.push('门店问题');
  if(!pri) missing.push('紧急程度');
  if(!deadline) missing.push('截止日期');
  return {shop:shop,desc:desc,pri:pri,deadline:deadline,missing:missing};
}

function recognizeVoiceText(){
  var transcript=document.getElementById('voice-transcript');
  var text=(transcript?transcript.value:STATE.voiceText).trim();
  if(!text){T('请先录音或输入需要识别的文字');return}
  STATE.voiceText=text;
  var currentShop=document.getElementById('iss-shop');
  var currentDesc=document.getElementById('iss-desc');
  var currentPri=document.getElementById('iss-pri');
  var currentDeadline=document.getElementById('iss-deadline');
  var currentProgress=document.getElementById('iss-progress');
  var preservedProgress=currentProgress?currentProgress.value:'未开始';
  var parsed=parseVoiceText(text);
  STATE.voiceParsed={
    shop:parsed.shop||(currentShop?currentShop.value:''),
    desc:parsed.desc||(currentDesc?currentDesc.value:''),
    pri:parsed.pri||(currentPri?currentPri.value:'P2'),
    deadline:parsed.deadline||(currentDeadline?currentDeadline.value:'')
  };
  STATE.voiceDetected={shop:parsed.shop,desc:parsed.desc,pri:parsed.pri,deadline:parsed.deadline};
  STATE.voiceMissing=parsed.missing;
  STATE.voiceParsedReady=true;
  if(STATE.editingIssueId){
    if(parsed.shop)markIssueFieldTouched('shop');
    if(parsed.desc)markIssueFieldTouched('desc');
    if(parsed.pri)markIssueFieldTouched('pri');
    if(parsed.deadline)markIssueFieldTouched('deadline');
  }
  renderApp();
  var targetShop=document.getElementById('iss-shop');
  var targetDesc=document.getElementById('iss-desc');
  var targetPri=document.getElementById('iss-pri');
  var targetDeadline=document.getElementById('iss-deadline');
  var targetProgress=document.getElementById('iss-progress');
  if(targetShop) targetShop.value=STATE.voiceParsed.shop;
  if(targetDesc) targetDesc.value=STATE.voiceParsed.desc;
  if(targetPri) targetPri.value=STATE.voiceParsed.pri;
  if(targetDeadline) targetDeadline.value=STATE.voiceParsed.deadline;
  if(targetProgress) targetProgress.value=preservedProgress;
  T(parsed.missing.length?'已填写可识别内容；请确认：'+parsed.missing.join('、'):'文字已识别并填入，请核对后添加');
  if(parsed.missing.length){
    var idMap={'门店名称':'iss-shop','门店问题':'iss-desc','紧急程度':'iss-pri','截止日期':'iss-deadline'};
    setTimeout(function(){var el=document.getElementById(idMap[parsed.missing[0]]);if(el)el.focus()},50);
  }
}

// ====== 日报快照 ======
function renderDaily(){
  var today=ts();
  var date=STATE.dailyDate||today;
  STATE.dailyDate=date;
  var h='<div class="daily-hdr">';
  h+='<div class="daily-date"><span style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:4px">'+I.clipboard+'</span> '+date+' 日报</div>';
  h+='<div><input type="date" id="daily-pick" value="'+date+'" onchange="STATE.dailyDate=this.value;renderApp()" style="font-size:14px;padding:5px 10px;border:1px solid var(--border);border-radius:4px"></div>';
  h+='</div>';

  var archs=STATE.data.archives.filter(function(a){return a.completedAt===date});
  var supp=STATE.data.dailySupps[date]||'';

  if(archs.length===0&&!supp){
    h+='<div class="empty">当日暂无完结记录</div>';
  } else {
    h+='<div class="daily-summary">';
    h+='<strong>今日完结 '+archs.length+' 项</strong>';
    for(var i=0;i<archs.length;i++){
      h+='<div class="daily-item"><span class="badge badge-'+archs[i].priority.toLowerCase()+'">'+esc(archs[i].priority)+'</span>'+
        esc(archs[i].shopName)+' - '+esc(archs[i].shopDesc||'')+'</div>';
    }
    h+='</div>';
  }

  h+='<div class="card"><div class="card-ttl">手动备注</div>';
  h+='<div class="form-group"><textarea id="daily-supp" placeholder="补充今日总结、待跟进事项...">'+esc(supp)+'</textarea></div>';
  h+='<button class="btn btn-sm btn-primary" onclick="saveDailySupp()">保存备注</button></div>';
  return h;
}
async function saveDailySupp(){
  if(!canStartMutation())return;
  var date=STATE.dailyDate||ts();
  var text=document.getElementById('daily-supp').value;
  STATE.data.dailySupps[date]=text;
  T((await saveUserData())?'备注已保存':'备注未保存，请重试');
}

// ====== 知识速查 ======
function renderKnowledge(){
  var h='<div class="card-ttl"><span style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:4px">'+I.book+'</span> 知识库速查</div>';
  h+='<div class="search-box">'+I.search+
    '<input type="text" placeholder="搜索业务规则、编码、知识域..." id="kw-search" oninput="renderApp()"></div>';

  // Add form
  h+='<div class="card" style="border-style:dashed">';
  h+='<div style="font-weight:700;font-size:13px;margin-bottom:8px">新增知识沉淀</div>';
  h+='<div class="form-row"><div class="form-group"><label>知识域</label><input id="kw-domain" placeholder="如：财务与分账"></div>';
  h+='<div class="form-group"><label>编码</label><input id="kw-code" placeholder="如：B107-B119"></div></div>';
  h+='<div class="form-group"><label>标题</label><input id="kw-title" placeholder="规则标题"></div>';
  h+='<div class="form-group"><label>内容</label><textarea id="kw-content" placeholder="详细规则描述"></textarea></div>';
  h+='<button class="btn btn-sm btn-primary" onclick="addKnowledge()">'+I.plus+' 添加到知识库</button>';
  h+='</div>';

  // List
  var query=(document.getElementById('kw-search')?document.getElementById('kw-search').value:'').trim().toLowerCase();
  var list=STATE.data.knowledge.slice();
  if(query){
    list=list.filter(function(k){
      return (k.domain||'').toLowerCase().indexOf(query)>=0||
        (k.code||'').toLowerCase().indexOf(query)>=0||
        (k.title||'').toLowerCase().indexOf(query)>=0||
        (k.content||'').toLowerCase().indexOf(query)>=0;
    });
  }
  h+='<div style="font-size:13px;color:var(--text3);margin-bottom:8px">共 '+list.length+' 条'+(query?'（搜索：'+esc(query)+'）':'')+'</div>';
  if(list.length===0){
    h+='<div class="empty">'+(query?'无匹配结果':'暂无知识沉淀')+'</div>';
  } else {
    for(var i=0;i<list.length;i++){
      var k=list[i];
      h+='<div class="know-card">';
      h+='<div class="kc-domain">'+esc(k.domain||'')+' <span class="kc-code">'+esc(k.code||'')+'</span></div>';
      h+='<div class="kc-title">'+esc(k.title||'')+'</div>';
      h+='<div class="kc-content">'+esc(k.content||'')+'</div>';
      h+='<div style="margin-top:8px"><button class="btn btn-xs btn-outline-danger" onclick="deleteKnowledge(\''+k.id+'\')">删除</button></div>';
      h+='</div>';
    }
  }
  return h;
}
async function addKnowledge(){
  var dom=document.getElementById('kw-domain').value.trim();
  var code=document.getElementById('kw-code').value.trim();
  var title=document.getElementById('kw-title').value.trim();
  var content=document.getElementById('kw-content').value.trim();
  if(!title){T('请填写标题');return}
  if(!canStartMutation())return;
  STATE.data.knowledge.unshift({id:gid(),domain:dom,code:code,title:title,content:content});
  var saving=saveUserData();
  renderApp();
  T((await saving)?'已添加到知识库并同步':'知识未同步，请重试');
}
async function deleteKnowledge(id){
  if(!canStartMutation())return;
  if(!confirm('确定删除此知识项？')) return;
  STATE.data.knowledge=STATE.data.knowledge.filter(function(k){return k.id!==id});
  var saving=saveUserData();
  renderApp();
  T((await saving)?'已删除并同步云端':'删除未同步，请重试');
}

// ====== 团队管理（管理员专属）=======
function renderTeam(){
  var passcodes=loadPasscodes();
  var h='<div class="card-ttl"><span style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:4px">'+I.users+'</span> 团队管理</div>';
  h+='<div class="import-section">';
  h+='<div class="is-title">团队数据已自动汇总</div>';
  h+='<div class="is-desc">成员保存的业务数据会实时写入 Supabase 云端。管理员驾驶舱已自动汇总 '+Object.keys(STATE.importedData).length+' 位其他成员的数据，不再需要收集和导入 JSON 文件。</div>';
  h+='</div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h+='<span style="font-weight:700;font-size:14px">成员管理（'+passcodes.length+' 人）</span>';
  h+='<button class="btn btn-sm btn-primary" onclick="showAddPasscode()">'+I.plus+' 新增成员说明</button>';
  h+='</div>';

  if(passcodes.length===0){
    h+='<div class="empty">暂无成员</div>';
  } else {
    for(var i=0;i<passcodes.length;i++){
      var p=passcodes[i];
      var isSelf=p.userId===STATE.user.userId;
      h+='<div class="pwd-card">';
      h+='<div class="pw-info">';
      h+='<div class="pw-name">'+esc(p.name||'')+(isSelf?' <span style="font-size:10px;color:var(--text3)">(我)</span>':'')+'</div>';
      h+='<div class="pw-meta">'+esc(p.department||'')+' · 用户名: <span class="pw-code">'+esc(p.username||'')+'</span> · '+
        (p.role==='admin'?'管理员':'成员')+' · 注册于 '+esc(p.createdAt||'')+'</div>';
      h+='</div>';
      h+='<div class="pw-actions">';
      h+='<button class="btn btn-xs" onclick="editPasscode(\''+p.userId+'\')">'+I.edit+'</button>';
      h+='</div></div>';
    }
  }
  return h;
}

function handleImportFile(input){
  var name=document.getElementById('imp-name').value.trim();
  var dept=document.getElementById('imp-dept').value.trim();
  if(!name){T('请填写成员姓名');input.value='';return}
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=async function(e){
    importMemberData(name, dept, e.target.result);
    renderApp();
  };
  reader.readAsText(file);
  input.value='';
}

// ====== 数据导入导出 ======
function exportData(){
  var exp={issues:STATE.data.issues,knowledge:STATE.data.knowledge,archives:STATE.data.archives,dailySupps:STATE.data.dailySupps,user:STATE.user?{name:STATE.user.name,department:STATE.user.department,role:STATE.user.role}:null,exportedAt:ts()};
  var json=JSON.stringify(exp,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='商云宝备份_'+ts()+'.json';
  a.click();
  T('导出成功');
}
function importData(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.issues){T('无效的备份文件格式');return}
      if(!canStartMutation()){input.value='';return}
      if(!confirm('将用备份数据覆盖当前数据（共'+d.issues.length+'条问题、'+(d.knowledge?d.knowledge.length:0)+'条知识），确定继续？')){input.value='';return}
      STATE.data.issues=d.issues||[];
      STATE.data.knowledge=d.knowledge||[];
      STATE.data.archives=d.archives||[];
      STATE.data.dailySupps=d.dailySupps||{};
      var saving=saveUserData();
      renderApp();
      T((await saving)?'数据已恢复并同步云端':'恢复数据未同步，请重试');
    }catch(err){T('JSON解析失败，请检查文件')}
  };
  reader.readAsText(file);
  input.value='';
}
async function confirmClear(){
  if(!canStartMutation())return;
  var isAdmin=STATE.user&&STATE.user.role==='admin';
  var scopeText=isAdmin?'仅清空当前管理员账号“'+STATE.user.name+'”的个人数据，不会删除其他成员数据。':'将清空当前账号的全部数据。';
  if(!confirm('⚠️ '+scopeText+'\n包括问题、知识库、归档和备注，此操作不可恢复！\n\n确定继续？')) return;
  if(!confirm('再次确认：'+(isAdmin?'清空我的数据（保留团队成员数据）？':'清空当前账号全部数据？'))) return;
  stopVoiceRecognition(true);
  STATE.data={issues:[],knowledge:[],archives:[],dailySupps:{}};
  STATE.editingIssueId=null;
  STATE.issueDetail=null;
  STATE.issueFormTouched={};
  STATE.pendingNewIssue=null;
  pendingHistoryOps={};
  STATE.voiceText='';
  STATE.voiceParsed={shop:'',desc:'',pri:'P2',deadline:''};
  STATE.voiceDetected={shop:'',desc:'',pri:'',deadline:''};
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var saving=saveUserData();
  renderApp();
  T((await saving)?(isAdmin?'我的数据已清空；团队成员数据已保留':'当前账号数据已清空并同步'):'清空操作未同步，请重试');
}

// ====== 初始化 ======
function scheduleFocusRefresh(){
  clearTimeout(focusRefreshTimer);
  focusRefreshTimer=setTimeout(function(){
    if(STATE.user) refreshFromCloud({source:'focus'});
  },300);
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') scheduleFocusRefresh();
});
window.addEventListener('focus',scheduleFocusRefresh);
window.addEventListener('beforeunload',function(event){
  stopVoiceRecognition(true);
  if(pendingSaves>0){
    event.preventDefault();
    event.returnValue='';
  }
});
(async function init(){
  if(!db){
    showLogin('云端配置缺失，请联系管理员');
    return;
  }
  try{
    var sessionResult=await db.auth.getSession();
    if(sessionResult.error) throw sessionResult.error;
    if(sessionResult.data.session&&sessionResult.data.session.user){
      await startUserSession(sessionResult.data.session.user);
      return;
    }
  }catch(error){
    console.error('[商云宝] 云端初始化失败',error);
    showLogin('云端连接失败，请刷新页面重试');
    return;
  }
  showLogin();
})();
</script>
