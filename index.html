<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>商云宝·客户管家台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2563eb;--primary-light:#dbeafe;--primary-lighter:#eff6ff;--primary-dark:#1d4ed8;
  --bg:#f8fafc;--card:#ffffff;--text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;
  --danger:#ef4444;--danger2:#fef2f2;
  --success:#10b981;--success2:#ecfdf5;
  --warn:#f59e0b;--warn2:#fffbeb;
  --r:12px;--rs:8px;--rxs:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --shadow2:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow3:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --t:.2s ease;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* === LOGIN === */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow3);padding:36px 28px;width:100%;max-width:400px}
.login-card h1{font-size:24px;text-align:center;margin-bottom:4px;color:var(--primary)}
.login-card .login-sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:24px}
.login-card .login-hint{text-align:center;font-size:12px;color:var(--text3);margin-top:16px;line-height:1.8}
.login-card .login-hint code{background:var(--primary-lighter);padding:2px 6px;border-radius:4px;font-weight:700;color:var(--primary-dark)}
.pass-input-box{position:relative}
.pass-input-box input{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--rs);
  font-size:20px;font-family:inherit;text-align:center;letter-spacing:6px;outline:none;
  transition:var(--t);
}
.pass-input-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:8px;min-height:20px}

/* === HEADER === */
.app-header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;box-shadow:var(--shadow);
}
.app-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.user-bar{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;font-weight:600}
.role-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.role-tag.admin{background:var(--primary-light);color:var(--primary-dark)}
.role-tag.viewer{background:#fef3c7;color:#92400e}
.role-tag.member{background:var(--success2);color:var(--success)}
.btn-logout{font-size:12px;color:var(--text3);cursor:pointer;padding:4px 8px;border-radius:4px;background:none;border:none}
.btn-logout:hover{background:var(--border2);color:var(--danger)}

/* === TODAY BAR === */
.today-bar{background:var(--card);margin:8px 16px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow)}
.today-bar .today-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.today-bar .today-ttl{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.ti-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border2)}
.ti-row:last-child{border-bottom:none}
.ti-row.overdue{color:var(--danger)}
.ti-pri{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;flex-shrink:0}
.ti-pri.P0{background:var(--danger2);color:var(--danger)}
.ti-pri.P1{background:var(--warn2);color:#b45309}
.ti-pri.P2{background:var(--border2);color:var(--text3)}
.ti-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-carousel{position:relative;min-height:48px}
.ti-slide{display:none;align-items:center;gap:7px;padding:2px 0;font-size:12px}
.ti-slide.active{display:flex}
.ti-slide-main{flex:1;min-width:0}
.ti-slide-title{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.ti-slide-title .ti-text{display:block}
.ti-slide-desc{font-size:11px;color:var(--text2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-slide-meta{display:flex;gap:7px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-top:1px}
.ti-slide.overdue .ti-slide-meta{color:var(--danger)}
.ti-carousel-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:0}
.ti-carousel-count{font-size:11px;color:var(--text3);min-width:42px;text-align:center}

/* === NAV TABS === */
.nav-tabs{display:flex;gap:0;margin:0 16px;background:var(--card);border-radius:var(--r) var(--r) 0 0;overflow:hidden;
  border:1px solid var(--border);border-bottom:none}
.nav-tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--text3);border-bottom:2px solid transparent;background:var(--border2);transition:var(--t)}
.nav-tab.active{color:var(--primary);background:var(--card);border-bottom-color:var(--primary)}
.nav-tab:hover:not(.active){color:var(--text2)}
.main-content{background:var(--card);margin:0 16px;padding:16px;border:1px solid var(--border);
  border-top:none;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);flex:1}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* === CARDS & SHARED === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-ttl{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border:1px solid var(--border);
  border-radius:var(--rs);background:var(--card);color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;transition:var(--t);min-height:44px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--border2);border-color:var(--text3)}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 10px;font-size:13px;min-height:36px}
.btn-xs{padding:3px 8px;font-size:11px;min-height:26px;border-radius:4px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-outline-danger{color:var(--danger);border-color:var(--danger);background:var(--danger2)}
.btn-voice{background:var(--danger2);color:var(--danger);border-color:#fca5a5;position:relative}
.btn-voice.recording{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.btn-block{display:flex;width:100%}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border:1px solid var(--border);border-radius:var(--rxs);background:var(--card);color:var(--text2);
  cursor:pointer;transition:var(--t);flex-shrink:0}
.icon-btn:hover{background:var(--border2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}

.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);
  font-size:16px;font-family:inherit;color:var(--text);background:var(--card);transition:var(--t);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge-p0{background:var(--danger2);color:var(--danger)}
.badge-p1{background:var(--warn2);color:#b45309}
.badge-p2{background:var(--border2);color:var(--text3)}
.badge-progress{background:var(--primary-light);color:var(--primary-dark)}
.badge-completed{background:var(--success2);color:var(--success)}

.kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.kpi-card .kpi-val{font-size:28px;font-weight:800;line-height:1.2}
.kpi-card .kpi-label{font-size:11px;color:var(--text3);margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}
.chart-box .chart-ttl{font-size:13px;font-weight:600;margin-bottom:8px}
.chart-box .chart-sub{font-size:10px;color:var(--text3);font-weight:400;margin-left:4px}
.dashboard-basis{font-size:11px;color:var(--text3);margin:-4px 0 10px;line-height:1.6}

.date-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

.issue-card{border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:8px;transition:var(--t)}
.issue-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow2)}
.issue-card .ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.issue-card .ic-store{font-weight:700;font-size:14px}
.issue-card .ic-desc{font-size:13px;color:var(--text2);margin-bottom:6px}
.issue-card .ic-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-bottom:8px}
.issue-card .ic-actions{display:flex;gap:6px;flex-wrap:wrap}
.issue-card.overdue{border-left:3px solid var(--danger)}

.know-card{border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.know-card .kc-domain{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.know-card .kc-title{font-size:14px;font-weight:700;margin-bottom:4px}
.know-card .kc-code{font-size:11px;color:var(--text3);margin-bottom:4px}
.know-card .kc-content{font-size:13px;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere}

.daily-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daily-date{font-size:16px;font-weight:700}
.daily-summary{background:var(--border2);border-radius:var(--rs);padding:12px;margin-bottom:10px;font-size:13px}
.daily-item{padding:4px 0;font-size:13px;border-bottom:1px solid var(--border2);display:flex;gap:8px;align-items:flex-start}

.pwd-card{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;gap:8px}
.pwd-card .pw-info{flex:1;min-width:0}
.pwd-card .pw-name{font-weight:600;font-size:14px}
.pwd-card .pw-code{font-family:monospace;font-size:13px;color:var(--primary-dark);background:var(--primary-lighter);padding:2px 8px;border-radius:4px;letter-spacing:2px}
.pwd-card .pw-meta{font-size:12px;color:var(--text3)}
.pwd-card .pw-actions{display:flex;gap:4px;flex-shrink:0}

.search-box{position:relative;margin-bottom:12px}
.search-box input{padding-left:34px}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);width:16px;height:16px}

/* Global SVG sizing */
.btn svg,.today-ttl svg,.card-ttl svg,.daily-date svg,.voice-preview svg{width:16px;height:16px;vertical-align:middle;flex-shrink:0}
.btn-xs svg{width:12px;height:12px}

.empty{text-align:center;padding:30px 16px;color:var(--text3);font-size:14px}

.voice-preview{background:var(--warn2);border:1px dashed #fcd34d;border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;font-size:13px;color:#92400e;display:none}
.voice-preview.show{display:block}
.voice-workspace{margin-top:10px;background:#fff;border:1px solid #fecaca;border-radius:var(--rs);padding:10px}
.voice-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.voice-transcript-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--text2);margin:9px 0 5px}
.voice-transcript{width:100%;min-height:92px;resize:vertical;padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:14px;line-height:1.6;color:var(--text);background:#fff}
.voice-transcript:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.voice-status{font-size:11px;color:var(--text3);font-weight:400}
.voice-mapped{margin-top:8px;padding:7px 9px;background:var(--success2);border-radius:6px;color:#047857;font-size:12px}
.p0-panel{border:1px solid #fca5a5;background:linear-gradient(180deg,#fff 0%,var(--danger2) 100%)}
.p0-panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.p0-panel-title strong{color:#b91c1c;font-size:14px}
.p0-work-order{background:#fff;border:1px solid #fecaca;border-left:4px solid var(--danger);border-radius:var(--rs);padding:10px 11px;margin-bottom:8px}
.p0-work-order:last-child{margin-bottom:0}
.p0-work-order-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p0-work-order-shop{font-weight:700;font-size:14px}
.p0-work-order-desc{font-size:13px;color:var(--text2);margin:5px 0}
.p0-work-order-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}

.footer-actions{display:flex;gap:8px;justify-content:center;padding:16px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:16px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:var(--r);padding:24px;width:100%;max-width:420px;box-shadow:var(--shadow3)}
.modal-box h3{font-size:16px;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.issue-detail-modal{max-width:720px;max-height:calc(100vh - 40px);overflow-y:auto;padding:0}
.issue-detail-header{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.issue-detail-header h3{margin:0;font-size:18px;line-height:1.35}
.issue-detail-body{padding:18px 20px 22px}
.issue-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.issue-detail-field{background:var(--border2);border-radius:var(--rxs);padding:9px 10px;min-width:0}
.issue-detail-field .idf-label{font-size:11px;color:var(--text3);margin-bottom:2px}
.issue-detail-field .idf-value{font-size:13px;font-weight:600;color:var(--text);overflow-wrap:anywhere}
.issue-detail-desc{padding:11px 12px;background:var(--primary-lighter);border-radius:var(--rs);font-size:13px;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:16px}
.followup-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin:15px 0 10px}
.followup-timeline{position:relative;margin-left:7px;padding-left:19px;border-left:2px solid var(--border)}
.followup-item{position:relative;padding:0 0 15px 2px}
.followup-item:last-child{padding-bottom:2px}
.followup-dot{position:absolute;left:-27px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 1px var(--primary-light)}
.followup-item.system .followup-dot{background:var(--text3);box-shadow:0 0 0 1px var(--border)}
.followup-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-bottom:3px}
.followup-content{font-size:13px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.followup-form{margin-top:16px;padding:12px;background:var(--primary-lighter);border:1px solid var(--primary-light);border-radius:var(--rs)}
.followup-form textarea{min-height:88px}
.readonly-note{margin-top:14px;padding:10px 12px;border-radius:var(--rs);background:var(--warn2);color:#92400e;font-size:12px}

.import-section{background:var(--primary-lighter);border:1px dashed var(--primary-light);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px}
.import-section .is-title{font-size:13px;font-weight:600;color:var(--primary-dark);margin-bottom:6px}
.import-section .is-desc{font-size:12px;color:var(--text2);margin-bottom:8px}
.import-info{font-size:12px;color:var(--primary-dark);margin-top:6px;background:var(--primary-light);padding:6px 10px;border-radius:4px}

@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .kpi-card.total{grid-column:span 2}
  .chart-row{grid-template-columns:1fr}
  .form-row,.form-row3{grid-template-columns:1fr}
  .nav-tab{font-size:12px;padding:10px 2px}
  .main-content{padding:12px 10px}
  .login-card{padding:24px 16px}
  .ti-slide{align-items:flex-start;flex-wrap:wrap}
  .ti-slide-main{flex-basis:calc(100% - 40px)}
  .voice-actions .btn{flex:1}
  .modal-mask{padding:8px;align-items:flex-end}
  .issue-detail-modal{max-height:92vh;border-radius:16px 16px 0 0}
  .issue-detail-header{padding:15px 14px 12px}
  .issue-detail-body{padding:14px}
  .issue-detail-grid{grid-template-columns:1fr 1fr}
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #app{padding-bottom:env(safe-area-inset-bottom)}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<div id="app"></div>

<script>
// ====== SVG 图标库 ======
var I = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',

// ====== 工具函数 ======
function gid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function shanghaiDateParts(value){
  var date=value instanceof Date?value:new Date(value||Date.now());
  try{
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
    var result={};parts.forEach(function(item){if(item.type==='year'||item.type==='month'||item.type==='day')result[item.type]=parseInt(item.value)});
    if(result.year&&result.month&&result.day)return result;
  }catch(e){}
  return {year:date.getFullYear(),month:date.getMonth()+1,day:date.getDate()};
}
function ts(){var p=shanghaiDateParts(new Date());return p.year+'-'+S(p.month)+'-'+S(p.day)}
function tsOffset(n){
  var p=shanghaiDateParts(new Date());
  var d=new Date(Date.UTC(p.year,p.month-1,p.day+Number(n||0),12));
  return d.getUTCFullYear()+'-'+S(d.getUTCMonth()+1)+'-'+S(d.getUTCDate());
}
function S(n){return String(n).padStart(2,'0')}
function parseLocalDate(value){
  var m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])):new Date(value);
}
function T(msg){var e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2000)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escAttr(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inlineArg(s){return encodeURIComponent(String(s===undefined||s===null?'':s)).replace(/'/g,'%27')}
function safePriority(value){return value==='P0'||value==='P1'||value==='P2'?value:'P2'}
var EXCEL_URGENCY_VALUES=['紧急','高','普通','低'];
var EXCEL_ASSIGNEE_NAMES=['郑康','张国鹏','杨柳','杜梦新','耿怡哲','张胜飞','张铭','张淦杨'];
function normalizeAssigneeName(value){
  value=String(value||'').trim();
  if(value==='张淏杨'||value==='张洏杨')return '张淦杨';
  return value;
}
function isValidExcelAssignee(value){return EXCEL_ASSIGNEE_NAMES.indexOf(normalizeAssigneeName(value))>=0}
function assigneeDisplayName(value){
  var name=normalizeAssigneeName(value);
  return isValidExcelAssignee(name)?name:(name?'需重新选择（原：'+name+'）':'需重新选择');
}
function normalizeUrgency(value,legacyPriority){
  value=String(value||'').trim();
  if(EXCEL_URGENCY_VALUES.indexOf(value)>=0)return value;
  var legacy=safePriority(value||legacyPriority);
  return legacy==='P0'?'紧急':(legacy==='P1'?'高':'普通');
}
function urgencyToPriority(value){
  value=normalizeUrgency(value);
  return value==='紧急'?'P0':(value==='高'?'P1':'P2');
}
function safeFollowStatus(value){
  value=String(value||'').trim();
  if(value==='已完结')return '已完结';
  if(value==='跟进中'||value==='阶段性完成')return '跟进中';
  return '';
}
function dateOnly(value){
  var text=String(value||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(text))return text;
  var matched=text.match(/^(\d{4}-\d{2}-\d{2})[T ]/);
  if(matched&&!/(?:Z|[+-]\d{2}:?\d{2})$/i.test(text))return matched[1];
  var parsed=new Date(text);
  if(!isNaN(parsed.getTime())){
    var p=shanghaiDateParts(parsed);
    return p.year+'-'+S(p.month)+'-'+S(p.day);
  }
  return matched?matched[1]:'';
}
function latestManualFollowUp(issue){
  var followUps=issue&&Array.isArray(issue.followUps)?issue.followUps:[];
  var manual=followUps.filter(function(item){return item&&item.type==='follow_up'});
  manual.sort(function(a,b){
    var byTime=String(b.followedAt||b.createdAt||'').localeCompare(String(a.followedAt||a.createdAt||''));
    return byTime||String(b.followUpId||b.id||'').localeCompare(String(a.followUpId||a.id||''));
  });
  return manual[0]||null;
}
function deriveCurrentStatus(issue){
  if(!issue)return '未跟进';
  var latest=latestManualFollowUp(issue);
  var latestStatus=latest?safeFollowStatus(latest.status||latest.toProgress):'';
  // 有人工跟进时只认“时间 + 跟进ID”排序后的最新一条；progress 仅供没有历史记录的旧数据兜底。
  if(latestStatus==='已完结'||(!latest&&safeFollowStatus(issue.progress)==='已完结'))return '已完结';
  if(issue.deadline){
    var deadlineDate=dateOnly(issue.deadline);
    if(deadlineDate&&deadlineDate<ts())return '已逾期';
  }
  return latest?'跟进中':'未跟进';
}
function normalizeFollowUpContract(item,issue){
  item=item&&typeof item==='object'?item:{};
  item.id=item.id||item.followUpId||gid();
  item.followUpId=String(item.followUpId||item.id);
  item.followedAt=item.followedAt||item.createdAt||'';
  item.createdAt=item.createdAt||item.followedAt||'';
  item.followerId=String(item.followerId||item.authorId||'');
  item.followerName=normalizeAssigneeName(item.followerName||item.authorName||'');
  item.authorId=item.authorId||item.followerId;
  item.authorName=normalizeAssigneeName(item.authorName||item.followerName);
  if(item.type==='follow_up')item.status=safeFollowStatus(item.status||item.toProgress||issue&&issue.progress)||'跟进中';
  return item;
}
function normalizeIssueContract(issue){
  issue=issue&&typeof issue==='object'?issue:{};
  issue.id=issue.id||gid();
  issue.ticketNo=String(issue.ticketNo||'').trim();
  issue.createdAt=issue.createdAt||ts();
  issue.urgency=normalizeUrgency(issue.urgency,issue.priority);
  issue.priority=urgencyToPriority(issue.urgency);
  issue.assigneeId=String(issue.assigneeId||'');
  issue.assigneeName=normalizeAssigneeName(issue.assigneeName);
  issue.deadline=String(issue.deadline||'');
  issue.followUps=Array.isArray(issue.followUps)?issue.followUps.map(function(item){return normalizeFollowUpContract(item,issue)}):[];
  var latest=latestManualFollowUp(issue);
  issue.latestFollowUpId=latest?latest.followUpId||latest.id:'';
  issue.latestFollowUpContent=latest?String(latest.content||''):'';
  issue.latestFollowUpAt=latest?String(latest.followedAt||latest.createdAt||''):'';
  issue.latestFollowUpStatus=latest?safeFollowStatus(latest.status||latest.toProgress):'';
  issue.followStatus=issue.latestFollowUpStatus;
  issue.currentStatus=deriveCurrentStatus(issue);
  if(issue.currentStatus==='已完结'){
    issue.progress='已完结';
    // Excel 的“实际完结时间”由最新一条“已完结”跟进时间计算，客户台保持同一口径。
    issue.completedAt=issue.latestFollowUpAt||issue.completedAt||issue.updatedAt||'';
  }else{
    if(safeFollowStatus(issue.progress)==='已完结')issue.progress=issue.latestFollowUpStatus||'跟进中';
    issue.completedAt='';
  }
  return issue;
}
function copyIssueContractToArchive(archive,issue){
  archive=archive&&typeof archive==='object'?archive:{};
  issue=normalizeIssueContract(issue);
  ['ticketNo','createdAt','shopName','shopDesc','urgency','priority','assigneeId','assigneeName','deadline','latestFollowUpId','latestFollowUpContent','latestFollowUpAt','latestFollowUpStatus','followStatus','currentStatus'].forEach(function(key){archive[key]=cloneJson(issue[key])});
  archive.sourceIssueId=issue.id;
  archive.completedAt=issue.completedAt||archive.completedAt||issue.latestFollowUpAt||ts();
  archive.followUps=cloneJson(issue.followUps||[]);
  return normalizeArchiveContract(archive);
}
function normalizeArchiveContract(archive){
  archive=archive&&typeof archive==='object'?archive:{};
  archive.ticketNo=String(archive.ticketNo||'').trim();
  archive.createdAt=String(archive.createdAt||archive.originalCreatedAt||'');
  archive.shopName=String(archive.shopName||'');
  archive.shopDesc=String(archive.shopDesc||'');
  var legacyPriority=archive.priority;
  archive.urgency=(archive.urgency||archive.priority)?normalizeUrgency(archive.urgency,archive.priority):'';
  archive.priority=archive.urgency?urgencyToPriority(archive.urgency):((legacyPriority==='P0'||legacyPriority==='P1'||legacyPriority==='P2')?legacyPriority:'');
  archive.assigneeId=String(archive.assigneeId||'');
  archive.assigneeName=normalizeAssigneeName(archive.assigneeName);
  archive.deadline=String(archive.deadline||'');
  archive.followUps=Array.isArray(archive.followUps)?archive.followUps.map(function(item){return normalizeFollowUpContract(item,{progress:'已完结'})}):[];
  var latest=latestManualFollowUp(archive);
  archive.latestFollowUpId=latest?String(latest.followUpId||latest.id):String(archive.latestFollowUpId||'');
  archive.latestFollowUpStatus=latest?safeFollowStatus(latest.status||latest.toProgress):(safeFollowStatus(archive.latestFollowUpStatus)||'已完结');
  archive.followStatus=archive.latestFollowUpStatus;
  archive.latestFollowUpContent=latest?String(latest.content||''):String(archive.latestFollowUpContent||'');
  archive.latestFollowUpAt=latest?String(latest.followedAt||latest.createdAt||''):String(archive.latestFollowUpAt||'');
  archive.completedAt=String(archive.latestFollowUpAt||archive.completedAt||'');
  archive.currentStatus='已完结';
  return archive;
}
function nowIso(){return new Date().toISOString()}
function formatDateTime(value){
  if(!value) return '时间未记录';
  var d=new Date(value);
  if(isNaN(d.getTime())) return String(value);
  return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}

function isRetryableWorkbookSyncError(details){
  details=details||{};
  if(details.code==='MISSING_SERVER_CONFIGURATION'||details.status===401||details.status===403||details.status===409||details.status===413)return false;
  if(details.status===408||details.status===425||details.status===429||details.status===500||details.status===502||details.status===503||details.status===504)return true;
  if(/^WPS_(HTTP|SCRIPT|INVALID|TEMP|UNAVAILABLE)|^SYNC_(CLAIM|FINISH|JOB)_/i.test(details.code))return true;

async function requestWorkbookSync(reason,context){
  context=context||{};
  var clientRequestId=String(context.requestId||gid());
  if(CLOUD_CONFIG.workbookSyncEnabled!==true)return {ok:true,skipped:true,status:'disabled',workbookSynced:false,pending:false,requestId:clientRequestId,attempts:0};
  if(!db||!db.functions||typeof db.functions.invoke!=='function')return {ok:false,skipped:true,status:'unavailable',workbookSynced:false,pending:true,requestId:clientRequestId,attempts:0};
  var functionName=CLOUD_CONFIG.workbookSyncFunction||'kdocs-workbook-sync';
  // body 在全部重试中保持不变，尤其 requestId 不变，避免同一次保存产生重复同步任务。
  var body=Object.assign({reason:reason||'workbench_data_saved',requestedAt:nowIso()},context,{requestId:clientRequestId});
  var lastDetails=null;
  var attempts=0;
  for(var attempt=0;attempt<3;attempt++){
    attempts=attempt+1;
    try{
      var result=await db.functions.invoke(functionName,{body:body});
      var data=result.data&&typeof result.data==='object'?result.data:{};
      if(result.error){
        lastDetails=workbookSyncErrorDetails(result.error,data);
        if(attempt<2&&isRetryableWorkbookSyncError(lastDetails)){
          await workbookSyncDelay(Math.min(3000,700*Math.pow(2,attempt)));
          continue;
        }
        break;
      }
      var status=String(data.status||'');
      if(data.ok===true&&(status==='succeeded'||status==='unchanged')){
        var deletionSynced=Number(data.deletions||0)>0;
        return {ok:true,data:data,status:status,workbookSynced:true,deletionSynced:deletionSynced,pending:false,requestId:clientRequestId,attempts:attempt+1};
      }
      if(status==='busy'){
        lastDetails={status:202,code:'SYNC_BUSY',message:'表格同步队列持续繁忙'};
        if(attempt>=2)break;
        var retrySeconds=Math.max(1,Math.min(10,Number(data.retryAfterSeconds)||2));
        await workbookSyncDelay(retrySeconds*1000);
        continue;
      }
      lastDetails=workbookSyncErrorDetails(null,data);
      if(attempt<2&&isRetryableWorkbookSyncError(lastDetails)){
        await workbookSyncDelay(Math.min(3000,700*Math.pow(2,attempt)));
        continue;
      }
      break;
    }catch(error){
      lastDetails=workbookSyncErrorDetails(error,{});
      if(attempt<2&&isRetryableWorkbookSyncError(lastDetails)){
        await workbookSyncDelay(Math.min(3000,700*Math.pow(2,attempt)));
        continue;
      }
      break;
    }
  }
  // 表格同步是二次链路，不回滚已经成功保存的 Supabase 业务数据。
  console.error('[商云宝] 工单表同步请求失败',lastDetails&&lastDetails.error||lastDetails);
  setCloudStatus('业务云端已保存，Excel表待补同步','var(--warning)');
  return {ok:false,status:'pending',workbookSynced:false,pending:true,error:lastDetails&&lastDetails.error||lastDetails,details:lastDetails,requestId:clientRequestId,attempts:attempts};
}
function legacyWorkbookDrainBlockers(){
  var data=STATE&&STATE.data||{};
  var issues=Array.isArray(data.issues)?data.issues:[];
  var archives=Array.isArray(data.archives)?data.archives:[];
  var archiveByIssue={};
  archives.forEach(function(item){
    if(!item||typeof item!=='object')return;
    var id=String(item.sourceIssueId||item.id||'').trim();
    if(id)archiveByIssue[id]=item;
  });
  var seen={};
  var blockers=[];
  function inspect(issue,archive){
    issue=issue&&typeof issue==='object'?issue:{};
    archive=archive&&typeof archive==='object'?archive:{};
    var id=String(issue.id||archive.sourceIssueId||archive.id||'').trim();
    if(!id||seen[id])return;
    seen[id]=true;
    var ticketNo=String(issue.ticketNo||archive.ticketNo||'').trim();
    var assigneeName=normalizeAssigneeName(issue.assigneeName||archive.assigneeName||'');
    var missing=[];
    if(!/^\d{11}$/.test(ticketNo))missing.push('ticketNo');
    if(!isValidExcelAssignee(assigneeName))missing.push('assigneeName');
    if(missing.length)blockers.push({issueId:id,missing:missing});
  }
  issues.forEach(function(issue){
    var id=String(issue&&issue.id||'').trim();
    inspect(issue,archiveByIssue[id]);
  });
  archives.forEach(function(archive){inspect(null,archive)});
  return blockers;
}

function normalizeUserData(d){
  d=d||{};

    return normalizeIssueContract(issue);
  }):[];
  var archives=Array.isArray(d.archives)?d.archives.filter(function(item){return item&&typeof item==='object'}).map(function(item){return normalizeArchiveContract(cloneJson(item))}):[];
  // 兼容旧版归档：旧数据没有 sourceIssueId，按门店、问题和创建日期做一次一对一关联。
  var linkedIssueIds={};
  archives.forEach(function(item){if(item.sourceIssueId!==undefined&&item.sourceIssueId!==null)linkedIssueIds[String(item.sourceIssueId)]=true});
  archives.forEach(function(item){
    if(item.sourceIssueId!==undefined&&item.sourceIssueId!==null)return;
    var archiveCreated=String(item.originalCreatedAt||item.createdAt||'');
    var candidates=issues.filter(function(issue){
      if(linkedIssueIds[String(issue.id)])return false;
      if(issue.currentStatus!=='已完结')return false;
      if(String(issue.shopName||'')!==String(item.shopName||''))return false;
      if(item.shopDesc!==undefined&&String(issue.shopDesc||'')!==String(item.shopDesc||''))return false;
      if((item.urgency!==undefined||item.priority!==undefined)&&normalizeUrgency(issue.urgency,issue.priority)!==normalizeUrgency(item.urgency,item.priority))return false;
      return !archiveCreated||!issue.createdAt||String(issue.createdAt)===archiveCreated;
    });
    if(candidates.length===1){item.sourceIssueId=candidates[0].id;linkedIssueIds[String(candidates[0].id)]=true}
  });
  var issueById={};
  issues.forEach(function(issue){issueById[String(issue.id)]=issue});
  archives=archives.filter(function(item){
    if(item.sourceIssueId===undefined||item.sourceIssueId===null)return true;
    var linked=issueById[String(item.sourceIssueId)];
    return !linked||linked.currentStatus==='已完结';

    var linked=item.sourceIssueId===undefined||item.sourceIssueId===null?null:issueById[String(item.sourceIssueId)];
    if(linked&&linked.currentStatus==='已完结'&&!linked.completedAt&&item.completedAt)linked.completedAt=item.completedAt;

function jsonEqual(a,b){

function mergeFollowUps(baseList,localList,remoteList){
  baseList=Array.isArray(baseList)?baseList:[];
  localList=Array.isArray(localList)?localList:[];
  remoteList=Array.isArray(remoteList)?remoteList:[];
  var baseMap={},localMap={},remoteMap={};
  baseList.forEach(function(item){if(item&&item.id!==undefined)baseMap[String(item.id)]=item});
  localList.forEach(function(item){if(item&&item.id!==undefined)localMap[String(item.id)]=item});
  remoteList.forEach(function(item){if(item&&item.id!==undefined)remoteMap[String(item.id)]=cloneJson(item)});
  localList.forEach(function(item){
    if(!item||item.id===undefined)return;
    var id=String(item.id),base=baseMap[id];
    if(!base||!jsonEqual(item,base))remoteMap[id]=cloneJson(item);
  });
  var seen={};
  return remoteList.concat(localList).filter(function(item){
    if(!item||item.id===undefined)return false;
    var id=String(item.id);if(seen[id])return false;seen[id]=true;return !!remoteMap[id];
  }).map(function(item){return remoteMap[String(item.id)]});
}
function mergeRecord(base,local,remote,kind,conflicts,recordKey){
  if(!remote)return cloneJson(local);
  if(!base){
    var added=Object.assign({},cloneJson(remote),cloneJson(local));
    if(kind==='issues')added.followUps=mergeFollowUps([],local.followUps,remote.followUps);
    return added;
  }
  var merged=cloneJson(remote);
  Object.keys(local||{}).forEach(function(key){
    if(key==='followUps'&&kind==='issues'){
      merged.followUps=mergeFollowUps(base.followUps,local.followUps,remote.followUps);
    }else if(!jsonEqual(local[key],base[key])){
      if(kind==='issues'&&['ticketNo','shopName','shopDesc','urgency','priority','assigneeId','assigneeName','deadline','progress','followStatus'].indexOf(key)>=0&&
        Object.prototype.hasOwnProperty.call(remote,key)&&!jsonEqual(remote[key],base[key])&&!jsonEqual(remote[key],local[key])){
        if(conflicts)conflicts.push({type:'field_conflict',collection:kind,key:recordKey,field:key});
      }
      merged[key]=cloneJson(local[key]);
    }
  });
  return merged;

function collectionKey(item,kind){

function mergeCollection(baseList,localList,remoteList,kind,conflicts){
  baseList=Array.isArray(baseList)?baseList:[];
  localList=Array.isArray(localList)?localList:[];
  remoteList=Array.isArray(remoteList)?remoteList:[];
  var baseMap={},localMap={},resultMap={};
  baseList.forEach(function(item){var key=collectionKey(item,kind);if(key)baseMap[key]=item});
  localList.forEach(function(item){var key=collectionKey(item,kind);if(key)localMap[key]=item});
  remoteList.forEach(function(item){var key=collectionKey(item,kind);if(key)resultMap[key]=cloneJson(item)});
  Object.keys(baseMap).forEach(function(key){
    if(Object.prototype.hasOwnProperty.call(localMap,key))return;
    if(resultMap[key]&&!jsonEqual(resultMap[key],baseMap[key])){
      if(conflicts)conflicts.push({type:'delete_conflict',collection:kind,key:key});
      return;
    }
    delete resultMap[key];
  });
  localList.forEach(function(item){
    var key=collectionKey(item,kind);if(!key)return;
    var base=baseMap[key],remote=resultMap[key];
    if(base&&!remote&&!jsonEqual(item,base)){
      if(kind==='issues'){
        var baseHistoryMap={};
        getIssueFollowUps(base).forEach(function(history){baseHistoryMap[String(history.id)]=history});
        var hasNewHistory=getIssueFollowUps(item).some(function(history){
          var previous=baseHistoryMap[String(history.id)];

        if(hasNewHistory){

          if(conflicts)conflicts.push({type:'remote_delete_overridden_by_followup',collection:kind,key:key});
          return;
        }
      }
      if(conflicts)conflicts.push({type:'update_after_remote_delete',collection:kind,key:key});
      return;
    }
    if(!base||!jsonEqual(item,base))resultMap[key]=mergeRecord(base,item,remote,kind,conflicts,key);
  });
  var seen={};
  return localList.concat(remoteList).filter(function(item){
    var key=collectionKey(item,kind);if(!key||seen[key]||!resultMap[key])return false;seen[key]=true;return true;

function mergeDailySupps(base,local,remote){

async function usernameToEmail(username){
  var normalized=username.trim().toLowerCase();
  var bytes=new TextEncoder().encode(normalized);
  if(window.crypto&&window.crypto.subtle){
    var digest=await window.crypto.subtle.digest('SHA-256',bytes);
    var hex=Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
    return 'u'+hex.slice(0,40)+'@syb-workbench.local';
  }
  var h=2166136261;
  for(var i=0;i<bytes.length;i++){h^=bytes[i];h=Math.imul(h,16777619)}
  return 'u'+(h>>>0).toString(16)+'@syb-workbench.local';
}

function saveUserData(syncContext){
  if(!db||!STATE.user) return Promise.resolve(false);
  var userId=STATE.user.userId;
  var workbookRequest=syncContext?Object.assign({requestId:gid(),ownerUserId:userId},syncContext):null;
  var snapshot=cloneJson(normalizeUserData(STATE.data));
  var baseSnapshot=cloneJson(normalizeUserData(cloudBaseline));
  var requestId=++latestSaveRequest;
  pendingSaves++;
  setCloudStatus('正在保存…','var(--warning)');
  var task=saveQueue.catch(function(){}).then(async function(){
    for(var attempt=0;attempt<5;attempt++){
      var current=await db.from('workbench_data').select('payload,updated_at').eq('user_id',userId).maybeSingle();
      if(current.error) throw current.error;
      if(!current.data){
        var inserted=await db.from('workbench_data').insert({user_id:userId,payload:snapshot}).select('payload,updated_at').maybeSingle();
        if(!inserted.error&&inserted.data)return {payload:normalizeUserData(inserted.data.payload),updated_at:inserted.data.updated_at||''};
        if(inserted.error&&inserted.error.code!=='23505')throw inserted.error;
        continue;
      }
      var remote=backfillOwnerAssignee(normalizeUserData(current.data.payload),STATE.user);
      var conflicts=[];
      var merged=mergeUserData(baseSnapshot,snapshot,remote,conflicts);
      var updated=await db.from('workbench_data').update({payload:merged})
        .eq('user_id',userId).eq('updated_at',current.data.updated_at)
        .select('payload,updated_at').maybeSingle();
      if(updated.error) throw updated.error;
      if(updated.data)return {payload:normalizeUserData(updated.data.payload),updated_at:updated.data.updated_at||'',conflicts:conflicts};
      await new Promise(function(resolve){setTimeout(resolve,60*(attempt+1))});
    }
    throw new Error('检测到多设备同时保存，自动合并重试仍未成功');
  });
  saveQueue=task.catch(function(){});
  return task.then(async function(saved){
    if(STATE.user&&STATE.user.userId===userId){
      var formDraft=captureIssueFormDraft();
      var beforeMerge=dataSignature(STATE.data);
      STATE.data=mergeUserData(snapshot,STATE.data,saved.payload);
      cloudBaseline=cloneJson(saved.payload);
      cloudRevision=saved.updated_at||'';
      if(beforeMerge!==dataSignature(STATE.data)){
        renderApp();
        restoreIssueFormDraft(formDraft);
      }
    }
    if(saved.conflicts&&saved.conflicts.length){
      setCloudStatus('业务云端已保存，并保留另一设备的新记录','var(--warning)');
    }else if(requestId===latestSaveRequest&&pendingSaves<=1){setCloudStatus('业务云端已保存','var(--success)')}
    var workbookSync=null;
    if(workbookRequest){
      setCloudStatus('业务云端已保存，正在同步Excel表…','var(--warning)');
      workbookSync=await requestWorkbookSync(workbookRequest.reason||'workbench_data_saved',Object.assign({},workbookRequest,{revision:saved.updated_at||''}));
      if(workbookSync.deletionSynced)setCloudStatus('业务云端已删除，WPS表格已同步清除','var(--success)');
      else if(workbookSync.workbookSynced)setCloudStatus('业务云端已保存，Excel表已同步','var(--success)');
      else if(workbookSync.skipped&&!workbookSync.pending)setCloudStatus('业务云端已保存，Excel表联动暂未启用','var(--warning)');
      else setCloudStatus('业务云端已保存，Excel表待补同步','var(--warning)');
    }
    pendingSaves=Math.max(0,pendingSaves-1);
    return {ok:true,businessSaved:true,conflicts:saved.conflicts||[],workbookSync:workbookSync,workbookSynced:!!(workbookSync&&workbookSync.workbookSynced)};
  }).catch(function(error){
    pendingSaves=Math.max(0,pendingSaves-1);
    console.error('[商云宝] 云端保存失败',error);
    setCloudStatus('云端保存失败','var(--danger)');
    T('云端保存失败，请检查网络后重试');
    return false;
  });
}

async function refreshFromCloud(options){
  options=options||{};
  if(!db||!STATE.user) return false;
  if(isRefreshingCloud){refreshQueued=true;return false}
  isRefreshingCloud=true;
  try{
    if(pendingSaves>0){
      await saveQueue.catch(function(){});
      // 让发起保存的操作先完成成功收尾或失败回滚，再捕获表单草稿。
      await new Promise(function(resolve){setTimeout(resolve,0)});
      if(pendingSaves>0){refreshQueued=true;return false}
    }
    if(!STATE.user)return false;
    var beforeOwn=dataSignature(STATE.data);
    var beforeTeam=dataSignature(STATE.importedData);
    var beforePermissions=permissionStateSignature();
    var editedIssueDeleted=false;
    await loadImportedData();
    await loadUserData();
    // 网络读取期间用户可能仍在输入；在真正重绘前捕获最新 DOM 草稿。
    var issueDraft=captureIssueFormDraft();
    if(STATE.editingIssueId&&!getEditingIssueRef()){
      editedIssueDeleted=true;
      clearIssueEditState();
      STATE.pendingNewIssue=null;
    }
    var changed=beforeOwn!==dataSignature(STATE.data)||beforeTeam!==dataSignature(STATE.importedData)||beforePermissions!==permissionStateSignature();
    if(changed){
      renderApp();
      restoreIssueFormDraft(issueDraft);
      if(editedIssueDeleted||!options.silent) T(editedIssueDeleted?'正在编辑的工单已被另一设备删除；内容已保留在新增表单':(options.source==='realtime'?'已收到其他设备的最新数据':'已刷新云端最新数据'));
    }
    setCloudStatus('已实时同步','var(--success)');
    return changed;
  }catch(error){
    console.error('[商云宝] 云端刷新失败',error);
    if(isAccountDeactivatedError(error)){
      await handleDeactivatedSession();
      return false;
    }
    setCloudStatus('云端刷新失败','var(--danger)');
    if(!options.silent) T('刷新失败，请检查网络后重试');
    return false;
  }finally{
    isRefreshingCloud=false;
    if(refreshQueued){
      refreshQueued=false;
      scheduleRealtimeRefresh();
    }
  }
}

async function loadImportedData(){
  if(!db||!STATE.user){STATE.importedData={};TEAM_PROFILES=[];return}
  var activeUserId=STATE.user.userId;
  var nextImported={},nextProfiles=[];
  var profilesResult=await db.from('profiles').select('id,username,name,department,role,can_view_all,is_active,deactivated_at,created_at').order('created_at',{ascending:true});
  if(profilesResult.error) throw profilesResult.error;
  nextProfiles=(profilesResult.data||[]).map(profileForUi);
  var activeProfile=nextProfiles.find(function(item){return item.userId===activeUserId});
  if(activeProfile&&activeProfile.isActive===false){
    var inactiveError=new Error('ACCOUNT_DEACTIVATED');inactiveError.code='ACCOUNT_DEACTIVATED';throw inactiveError;
  }
  var permissionChanged=false;
  if(activeProfile&&STATE.user&&STATE.user.userId===activeUserId){
    var previousTier=permissionTier(STATE.user);
    STATE.user.name=activeProfile.name;
    STATE.user.department=activeProfile.department;
    STATE.user.role=activeProfile.role;
    STATE.user.canViewAll=activeProfile.canViewAll;
    STATE.user.isActive=activeProfile.isActive;
    STATE.user.deactivatedAt=activeProfile.deactivatedAt||'';
    permissionChanged=previousTier!==permissionTier(STATE.user);
  }
  var activeCanViewTeam=canViewTeamData(STATE.user);
  if(!activeCanViewTeam){
    if(STATE.user&&STATE.user.userId===activeUserId){TEAM_PROFILES=nextProfiles;STATE.importedData={}}
    if(permissionChanged)setTimeout(startRealtimeSync,0);
    return;
  }
  var dataResult=await db.from('workbench_data').select('user_id,payload,updated_at');
  if(dataResult.error) throw dataResult.error;
  (dataResult.data||[]).forEach(function(row){
    if(row.user_id===activeUserId) return;
    var p=nextProfiles.find(function(item){return item.userId===row.user_id});
    if(!p) return;
    var memberData=normalizeUserData(row.payload);
    backfillOwnerAssignee(memberData,p);
    nextImported[row.user_id]={name:p.name,department:p.department,data:memberData,importedAt:(row.updated_at||'').slice(0,10)};
  });
  if(STATE.user&&STATE.user.userId===activeUserId){TEAM_PROFILES=nextProfiles;STATE.importedData=nextImported}
  if(permissionChanged)setTimeout(startRealtimeSync,0);
}

function importMemberData(name, department, jsonStr){
  try{
    var d=JSON.parse(jsonStr);
    if(!d.issues&&!d.archives){T('无效的数据格式，请确认导出了正确的JSON文件');return false}
    var uid='imp_'+gid();

function getScopedIssues(){

function isIssueCompleted(issue){
  return !!issue&&deriveCurrentStatus(issue)==='已完结';
}
function dashboardOwnerId(item){
  return String(item&&item._ownerUserId||(STATE.user&&STATE.user.userId)||'');
}
function getDashIssues(){
  var issues=getScopedIssues();
  var archives=getScopedArchives();
  var result=issues.slice(),issueById={},issueByTicket={};
  issues.forEach(function(issue){
    var ownerId=dashboardOwnerId(issue);
    if(issue.id!==undefined&&issue.id!==null)issueById[ownerId+'|'+String(issue.id)]=true;
    var ticketNo=String(issue.ticketNo||'').trim();
    if(ticketNo)issueByTicket[ticketNo]=true;
  });
  archives.forEach(function(archive,index){
    var ownerId=dashboardOwnerId(archive);
    var sourceId=archive.sourceIssueId===undefined||archive.sourceIssueId===null?'':String(archive.sourceIssueId);
    var ticketNo=String(archive.ticketNo||'').trim();
    if((sourceId&&issueById[ownerId+'|'+sourceId])||(ticketNo&&issueByTicket[ticketNo]))return;
    var completed=cloneJson(archive);
    completed.id=sourceId||completed.id||('archive-only-'+ownerId+'-'+index);
    completed.progress='已完结';completed.currentStatus='已完结';
    completed.completedAt=completed.completedAt||completed.latestFollowUpAt||'';
    result.push(completed);
    if(ticketNo)issueByTicket[ticketNo]=true;
  });
  return result;
}

function dashStats(){
  var issues = getDashIssues();
  var total=issues.length;
  var open=0,inProg=0,done=0,overdue=0;
  for(var i=0;i<issues.length;i++){
    var s=deriveCurrentStatus(issues[i]);issues[i].currentStatus=s;
    if(s==='已完结')done++;
    else if(s==='已逾期')overdue++;
    else if(s==='跟进中')inProg++;
    else open++;
  }
  return {total:total,open:open,inProg:inProg,done:done,overdue:overdue};
}

function dashAssigneeData(){

function dashTrendData(days){
  days=Math.max(2,Number(days)||7);
  var rows=[],rowByDate={};
  for(var i=days-1;i>=0;i--){
    var date=tsOffset(-i),row={date:date,label:date.slice(5),created:0,completed:0};
    rows.push(row);rowByDate[date]=row;
  }
  getDashIssues().forEach(function(issue){
    var createdDate=dateOnly(issue.createdAt);
    if(rowByDate[createdDate])rowByDate[createdDate].created++;
    if(!isIssueCompleted(issue))return;
    var completedDate=dateOnly(issue.completedAt||issue.latestFollowUpAt);
    if(rowByDate[completedDate])rowByDate[completedDate].completed++;
  });
  return rows;
}

// ====== SVG 图表 ======
function svgPie(data){
  var total=data.reduce(function(s,d){return s+d.v},0);
  if(total===0) return '<div style="color:#94a3b8;padding:30px">暂无数据</div>';
  var cx=80,cy=80,r=65,ir=40;
  var angle=0,slices='';
  for(var i=0;i<data.length;i++){
    if(!data[i].v)continue;
    if(data[i].v===total){slices+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+data[i].c+'"/>';continue}
    var a=(data[i].v/total)*Math.PI*2;
    var x1=cx+r*Math.sin(angle),y1=cy-r*Math.cos(angle);
    angle+=a;
    var x2=cx+r*Math.sin(angle),y2=cy-r*Math.cos(angle);
    var la=a>Math.PI?1:0;
    slices+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+la+',1 '+x2+','+y2+' Z" fill="'+data[i].c+'"/>';
  }
  var legend='';
  for(var j=0;j<data.length;j++){
    legend+='<div style="display:inline-flex;align-items:center;gap:4px;margin:0 8px;font-size:11px">'+
      '<span style="width:10px;height:10px;border-radius:2px;background:'+data[j].c+';display:inline-block"></span>'+
      data[j].label+' '+data[j].v+'</div>';
  }
  return '<svg viewBox="0 0 160 160" style="max-width:200px">'+slices+'<circle cx="'+cx+'" cy="'+cy+'" r="'+ir+'" fill="#fff"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="18" font-weight="800" fill="#1e293b">'+total+'</text></svg><div style="margin-top:6px">'+legend+'</div>';
}

function svgBar(data){
  var max=Math.max.apply(null,data.map(function(d){return d.v}));
  if(max===0) max=1;
  var barW=44,gap=20,pad=10,w=Math.max(260,pad*2+data.length*barW+(data.length-1)*gap),h=140;
  var bars='';
  for(var i=0;i<data.length;i++){
    var bh=(data[i].v/max)*(h-40);
    var bx=pad+i*(barW+gap);
    var by=h-20-bh;
    bars+='<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+data[i].c+'"/>';
    bars+='<text x="'+(bx+barW/2)+'" y="'+(by-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">'+data[i].v+'</text>';
    bars+='<text x="'+(bx+barW/2)+'" y="'+(h-4)+'" text-anchor="middle" font-size="11" fill="#64748b">'+data[i].label+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="max-width:300px">'+bars+'</svg>';
}

function svgHorizontalBar(data){
  if(!data.length)return '<div style="color:#94a3b8;padding:30px">暂无未完结工单</div>';
  var max=Math.max.apply(null,data.map(function(d){return d.v}))||1;
  var rowH=24,labelW=62,valueW=24,w=360,h=18+data.length*rowH;
  var bars='';
  for(var i=0;i<data.length;i++){
    var y=10+i*rowH,barW=Math.max(2,(data[i].v/max)*(w-labelW-valueW-20));
    bars+='<text x="'+(labelW-6)+'" y="'+(y+12)+'" text-anchor="end" font-size="11" fill="#475569">'+esc(data[i].label)+'</text>';
    bars+='<rect x="'+labelW+'" y="'+y+'" width="'+barW+'" height="15" rx="4" fill="'+data[i].c+'"/>';
    bars+='<text x="'+(labelW+barW+6)+'" y="'+(y+12)+'" font-size="11" font-weight="700" fill="#1e293b">'+data[i].v+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:420px">'+bars+'</svg>';
}

function svgTrend(data){
  if(!data.length)return '<div style="color:#94a3b8;padding:30px">暂无数据</div>';
  var w=380,h=172,left=28,right=12,top=16,bottom=36;
  var values=[];data.forEach(function(d){values.push(d.created,d.completed)});
  var max=Math.max.apply(null,values.concat([1]));
  var xStep=(w-left-right)/Math.max(1,data.length-1),plotH=h-top-bottom;
  function px(i){return left+i*xStep}
  function py(v){return top+plotH-(v/max)*plotH}
  var grid='',createdPoints=[],completedPoints=[],marks='';
  for(var g=0;g<=2;g++){
    var gv=Math.round(max*(2-g)/2),gy=top+plotH*g/2;
    grid+='<line x1="'+left+'" y1="'+gy+'" x2="'+(w-right)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1"/><text x="'+(left-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#94a3b8">'+gv+'</text>';
  }
  data.forEach(function(d,i){
    var x=px(i),yc=py(d.created),yd=py(d.completed);
    createdPoints.push(x+','+yc);completedPoints.push(x+','+yd);
    marks+='<circle cx="'+x+'" cy="'+yc+'" r="3" fill="#2563eb"/><circle cx="'+x+'" cy="'+yd+'" r="3" fill="#10b981"/>';
    marks+='<text x="'+x+'" y="'+(h-17)+'" text-anchor="middle" font-size="9" fill="#64748b">'+d.label+'</text>';
  });
  var legend='<g transform="translate('+(w-128)+',2)"><line x1="0" y1="6" x2="14" y2="6" stroke="#2563eb" stroke-width="3"/><text x="18" y="9" font-size="9" fill="#475569">新增</text><line x1="58" y1="6" x2="72" y2="6" stroke="#10b981" stroke-width="3"/><text x="76" y="9" font-size="9" fill="#475569">完结</text></g>';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:430px">'+grid+'<polyline points="'+createdPoints.join(' ')+'" fill="none" stroke="#2563eb" stroke-width="2.5"/><polyline points="'+completedPoints.join(' ')+'" fill="none" stroke="#10b981" stroke-width="2.5"/>'+marks+legend+'</svg>';
}

// ====== 未处理工单轮播（不受驾驶舱日期筛选影响） ======
function getOpenWorkItems(){
  var items=[];
  var today=ts();
  var issues=getScopedIssues();
  for(var i=0;i<issues.length;i++){
    var iss=issues[i];
    if(isIssueCompleted(iss)) continue;
    var type='pending';
    if(iss.deadline){
      var deadlineDate=dateOnly(iss.deadline);
      if(deadlineDate&&deadlineDate<today) type='overdue';
      else if(deadlineDate===today) type='today';
    }
    items.push({issue:iss,type:type});
  }
  var priOrder={'紧急':0,'高':1,'普通':2,'低':3};
  items.sort(function(a,b){
    var aUrgency=normalizeUrgency(a.issue.urgency,a.issue.priority),bUrgency=normalizeUrgency(b.issue.urgency,b.issue.priority);
    var ap=priOrder[aUrgency]===undefined?2:priOrder[aUrgency];
    var bp=priOrder[bUrgency]===undefined?2:priOrder[bUrgency];
    if(ap!==bp) return ap-bp;
    if(a.type==='overdue'&&b.type!=='overdue') return -1;
    if(a.type!=='overdue'&&b.type==='overdue') return 1;
    var ad=a.issue.deadline||'9999-12-31',bd=b.issue.deadline||'9999-12-31';
    if(ad!==bd) return ad.localeCompare(bd);
    return (a.issue.createdAt||'').localeCompare(b.issue.createdAt||'');
  });
  return items;
}

function getOpenP0Issues(){
  return getOpenWorkItems().filter(function(item){return normalizeUrgency(item.issue.urgency,item.issue.priority)==='紧急'});
}

var workCarouselTimer=null;
var workCarouselIndex=0;
function stopWorkCarousel(){
  if(workCarouselTimer){clearInterval(workCarouselTimer);workCarouselTimer=null}

function showWorkCarouselItem(index){
  var slides=document.querySelectorAll('.ti-slide');
  if(!slides.length) return;
  workCarouselIndex=((index%slides.length)+slides.length)%slides.length;
  for(var i=0;i<slides.length;i++) slides[i].classList.toggle('active',i===workCarouselIndex);
  var counter=document.getElementById('ti-carousel-count');
  if(counter) counter.textContent=(workCarouselIndex+1)+' / '+slides.length;
}
function startWorkCarousel(){
  stopWorkCarousel();
  var slides=document.querySelectorAll('.ti-slide');
  if(!slides.length) return;
  showWorkCarouselItem(Math.min(workCarouselIndex,slides.length-1));
  if(slides.length>1){
    workCarouselTimer=setInterval(function(){showWorkCarouselItem(workCarouselIndex+1)},4500);
  }
}
function moveWorkCarousel(step){
  showWorkCarouselItem(workCarouselIndex+step);
  startWorkCarousel();
}

async function startUserSession(authUser){
  var profileResult=await db.from('profiles').select('id,username,name,department,role,can_view_all,is_active,deactivated_at,created_at').eq('id',authUser.id).single();
  if(profileResult.error) throw profileResult.error;
  if(profileResult.data.is_active===false){
    var inactiveError=new Error('ACCOUNT_DEACTIVATED');inactiveError.code='ACCOUNT_DEACTIVATED';throw inactiveError;
  }
  STATE.user=profileToUser(profileResult.data);
  STATE.adminFullWorkbookSync={status:'idle',message:'',requestId:''};
  clearIssueEditState();
  STATE.pendingNewIssue=null;
  pendingHistoryOps={};
  await loadUserData();
  await loadImportedData();

async function doRegister(){
  var name=document.getElementById('reg-name').value.trim();
  var username=document.getElementById('reg-user').value.trim();
  var dept=document.getElementById('reg-dept').value.trim();
  var pass=document.getElementById('reg-pass').value.trim();
  var pass2=document.getElementById('reg-pass2').value.trim();
  var errEl=document.getElementById('reg-error');
  if(!name){errEl.textContent='请填写姓名';return}
  if(!username){errEl.textContent='请设置用户名';return}
  if(!/^[a-zA-Z0-9\u4e00-\u9fa5]+$/.test(username)){errEl.textContent='用户名只能使用字母、数字或中文';return}
  if(!pass||pass.length<6){errEl.textContent='密码至少6位';return}
  if(pass!==pass2){errEl.textContent='两次输入的密码不一致';return}
  if(!db){errEl.textContent='云端连接尚未配置';return}
  errEl.textContent='正在创建云端账号…';
  try{
    var email=await usernameToEmail(username);
    var result=await db.auth.signUp({email:email,password:pass,options:{data:{username:username,name:name,department:dept}}});
    if(result.error) throw result.error;
    if(!result.data.session){throw new Error('注册成功但尚未自动登录，请联系管理员关闭邮箱确认')}
    await startUserSession(result.data.user);
    T('注册成功，欢迎 '+name+'！');
  }catch(error){
    console.error('[商云宝] 注册失败',error);
    var msg=(error&&error.message)||'';
    errEl.textContent=(msg.indexOf('already')>=0||msg.indexOf('Database error')>=0)?'该用户名已被注册，请换一个':'注册失败：'+msg;
  }
}

async function doLogin(){
  var uname=document.getElementById('login-user').value.trim();
  var pwd=document.getElementById('login-pass').value.trim();
  if(!uname){showLogin('请输入用户名');return}
  if(!pwd){showLogin('请输入密码');return}
  if(!db){showLogin('云端连接尚未配置');return}
  try{
    var email=await usernameToEmail(uname);
    var result=await db.auth.signInWithPassword({email:email,password:pwd});
    if(result.error) throw result.error;
    await startUserSession(result.data.user);
    T('欢迎回来，数据已从云端恢复！');
  }catch(error){
    console.error('[商云宝] 登录失败',error);
    if(isAccountDeactivatedError(error)){await handleDeactivatedSession();return}
    showLogin('用户名或密码错误，请检查后重试');
  }
}

function getIssueFollowUps(issue){
  if(!issue||!Array.isArray(issue.followUps)) return [];
  return issue.followUps.filter(function(item){return item&&typeof item==='object'&&typeof item.content==='string'});
}
function appendIssueHistory(issue,type,content,fromProgress,toProgress,options){
  if(!issue) return null;
  options=options||{};
  var entry={
    id:options.id||gid(),type:type||'follow_up',content:String(content||''),
    fromProgress:fromProgress||'',toProgress:toProgress||'',
    authorId:STATE.user?STATE.user.userId:'',authorName:STATE.user?STATE.user.name:'',createdAt:options.createdAt||nowIso()
  };
  entry.followUpId=String(entry.id);
  entry.followedAt=entry.createdAt;
  entry.followerId=String(options.followerId||entry.authorId);
  entry.followerName=normalizeAssigneeName(options.followerName||entry.authorName);
  if(entry.type==='follow_up')entry.status=safeFollowStatus(options.status||toProgress)||'跟进中';
  issue.followUps=getIssueFollowUps(issue).slice();
  var existingIndex=issue.followUps.findIndex(function(item){return String(item.id)===String(entry.id)});
  if(existingIndex>=0)issue.followUps[existingIndex]=entry;
  else issue.followUps.push(entry);
  issue.updatedAt=entry.createdAt;
  return entry;
}
function pendingHistoryOperation(key){
  if(!pendingHistoryOps[key])pendingHistoryOps[key]={id:gid(),createdAt:nowIso()};
  return pendingHistoryOps[key];
}
function syncIssueArchiveForData(data,issue){
  normalizeIssueContract(issue);
  data.archives=Array.isArray(data.archives)?data.archives:[];
  var issueId=String(issue.id);
  if(issue.currentStatus!=='已完结'){
    data.archives=data.archives.filter(function(item){return String(item.sourceIssueId)!==issueId});
    return false;
  }
  var existing=data.archives.find(function(item){return String(item.sourceIssueId)===issueId});
  var snapshot=copyIssueContractToArchive(existing||{},issue);
  if(existing)return false;
  snapshot.id=gid();
  data.archives.unshift(snapshot);
  return true;
}
function unwrapTeamIssueMutationResult(data){
  var result=Array.isArray(data)?data[0]:data;
  if(result&&typeof result==='object'&&!result.payload&&!result.issue){
    var keys=Object.keys(result);
    if(keys.length===1&&result[keys[0]]&&typeof result[keys[0]]==='object')result=result[keys[0]];
  }
  return result&&typeof result==='object'?result:{};
}
function teamIssueMutationErrorCode(error){
  var text=String(error&&error.message||'').toLowerCase();
  if(text.indexOf('issue_not_found')>=0||text.indexOf('工单已被删除')>=0||text.indexOf('工单不存在')>=0)return 'issue_not_found';
  if(text.indexOf('account_not_found')>=0||text.indexOf('成员数据不存在')>=0)return 'account_not_found';
  if(text.indexOf('forbidden')>=0||text.indexOf('管理员')>=0)return 'forbidden';
  return error&&error.code||'save_failed';
}
async function saveTeamIssueMutation(ownerUserId,issueId,mutation){
  if(!db||!STATE.user||!isAdmin(STATE.user)||!ownerUserId||ownerUserId===STATE.user.userId){
    return {ok:false,code:'forbidden'};
  }
  mutation=mutation||{};
  var activeAdminId=STATE.user.userId;
  pendingSaves++;
  setCloudStatus('正在保存团队工单…','var(--warning)');
  var task=saveQueue.catch(function(){}).then(async function(){
    for(var attempt=0;attempt<3;attempt++){
      var response=await db.rpc('admin_mutate_team_issue',{
        p_owner_user_id:ownerUserId,
        p_issue_id:String(issueId),
        p_patch:mutation.patch||{},
        p_history:mutation.history||null,
        p_expected_issue_updated_at:mutation.expectedIssueUpdatedAt||null
      });
      if(!response.error)return {result:unwrapTeamIssueMutationResult(response.data),retries:attempt};
      if(response.error.code!=='40001'&&response.error.code!=='40P01')throw response.error;
      await new Promise(function(resolve){setTimeout(resolve,60*(attempt+1))});
    }
    var retryError=new Error('成员正在同时修改，自动重试仍未成功');retryError.code='concurrent_update';throw retryError;
  });
  saveQueue=task.catch(function(){});
  return task.then(async function(saved){
    var rpcResult=saved.result||{};
    if(STATE.user&&STATE.user.userId===activeAdminId&&isAdmin(STATE.user)&&STATE.importedData[ownerUserId]){
      if(rpcResult.payload){
        STATE.importedData[ownerUserId].data=backfillOwnerAssignee(normalizeUserData(rpcResult.payload),{userId:ownerUserId,name:STATE.importedData[ownerUserId].name});
      }else if(rpcResult.issue){
        var nextData=normalizeUserData(cloneJson(STATE.importedData[ownerUserId].data));
        var issueIndex=nextData.issues.findIndex(function(item){return String(item.id)===String(issueId)});
        if(issueIndex>=0)nextData.issues[issueIndex]=normalizeIssueContract(cloneJson(rpcResult.issue));
        STATE.importedData[ownerUserId].data=nextData;
      }
      STATE.importedData[ownerUserId].importedAt=String(rpcResult.updated_at||'').slice(0,10);
    }
    setCloudStatus('业务云端已保存，正在同步Excel表…','var(--warning)');
    var workbookSync=await requestWorkbookSync(mutation.syncReason||'team_issue_mutated',{requestId:mutation.syncRequestId||gid(),ownerUserId:ownerUserId,issueId:String(issueId),revision:rpcResult.updated_at||''});
    if(workbookSync.workbookSynced)setCloudStatus('业务云端已保存，Excel表已同步','var(--success)');
    else if(workbookSync.skipped&&!workbookSync.pending)setCloudStatus('业务云端已保存，Excel表联动暂未启用','var(--warning)');
    else setCloudStatus('业务云端已保存，Excel表待补同步','var(--warning)');
    pendingSaves=Math.max(0,pendingSaves-1);
    return {ok:true,businessSaved:true,workbookSync:workbookSync,workbookSynced:!!workbookSync.workbookSynced,metadata:{fieldConflict:!!rpcResult.conflict,conflict:rpcResult.conflict||null,issue:rpcResult.issue||null},retries:saved.retries||0};
  }).catch(function(error){
    pendingSaves=Math.max(0,pendingSaves-1);
    console.error('[商云宝] 管理员保存团队工单失败',error);
    setCloudStatus('团队工单保存失败','var(--danger)');
    return {ok:false,code:teamIssueMutationErrorCode(error),error:error};
  });
}
function findIssueRef(ownerUserId,issueId){
  var ownId=STATE.user?STATE.user.userId:'';
  var owner=ownerUserId||ownId;
  if(owner===ownId){
    var own=findIssue(issueId);
    return own&&own.id?{issue:own,ownerUserId:ownId,ownerName:STATE.user.name,ownerDept:STATE.user.department||'',readOnly:false}:null;
  }
  if(!canViewTeamData(STATE.user)) return null;
  var member=STATE.importedData[owner];
  if(!member||!member.data||!Array.isArray(member.data.issues)) return null;
  var issue=member.data.issues.find(function(item){return String(item.id)===String(issueId)});
  return issue?{issue:issue,ownerUserId:owner,ownerName:member.name||'未知成员',ownerDept:member.department||'',readOnly:!isAdmin(STATE.user)}:null;
}

async function addIssueFollowUp(){
  var detail=STATE.issueDetail;
  if(!detail||detail.saving) return;
  if(!canStartMutation())return;
  var ref=findIssueRef(detail.ownerUserId,detail.issueId);
  if(!ref&&STATE.user&&!canViewTeamData(STATE.user)) ref=findIssueRef(STATE.user.userId,detail.issueId);
  if(!ref){T('工单已被删除或刚刚发生同步变化，请重新打开详情');return}
  if(ref.readOnly){T('团队成员工单仅支持查看');return}
  var input=document.getElementById('followup-content');
  var progressEl=document.getElementById('followup-progress');
  var followerEl=document.getElementById('followup-follower');
  var content=(input?input.value:detail.draftContent||'').trim();
  if(!content){T('请填写本次跟进内容');if(input)input.focus();return}
  var issue=ref.issue;
  if(!isValidExcelAssignee(issue.assigneeName)){
    T('请先编辑工单，从Excel名单中选择有效跟进人');
    return;
  }
  var followerName=normalizeAssigneeName(followerEl?followerEl.value:detail.draftFollowerName||issue.assigneeName);
  if(!isValidExcelAssignee(followerName)){
    T('请从Excel名单中选择本次跟进人');
    if(followerEl)followerEl.focus();
    return;
  }
  detail.draftFollowerName=followerName;
  var follower=findAssigneeByName(followerName);
  if(!follower.id&&normalizeAssigneeName(issue.assigneeName)===followerName)follower.id=String(issue.assigneeId||'');
  // 名单成员尚未注册客户台账号时仍保留稳定身份键，避免 followerId 错记成实际操作人。
  if(!follower.id)follower.id='excel-assignee:'+followerName;
  var nextProgress=safeFollowStatus(progressEl?progressEl.value:detail.draftProgress)||'跟进中';
  var oldProgress=safeFollowStatus(issue.latestFollowUpStatus||issue.progress)||'跟进中';
  var before=JSON.parse(JSON.stringify(STATE.data));
  detail.saving=true;
  var saveBtn=document.getElementById('followup-save-btn');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='正在保存…'}
  if(!detail.pendingHistoryId){detail.pendingHistoryId=gid();detail.pendingHistoryCreatedAt=nowIso()}
  if(ref.ownerUserId!==STATE.user.userId){
    var requestedProgress=nextProgress;
    var teamSaved=await saveTeamIssueMutation(ref.ownerUserId,detail.issueId,{
      patch:{progress:requestedProgress},
      history:{id:detail.pendingHistoryId,followUpId:detail.pendingHistoryId,type:'follow_up',content:content,status:requestedProgress,fromProgress:oldProgress,toProgress:requestedProgress,followedAt:detail.pendingHistoryCreatedAt,createdAt:detail.pendingHistoryCreatedAt,followerId:follower.id,followerName:follower.name,authorId:STATE.user.userId,authorName:STATE.user.name},
      expectedIssueUpdatedAt:issue.updatedAt||null,
      syncReason:'followup_created',syncRequestId:detail.pendingHistoryId
    });
    detail.saving=false;
    if(!teamSaved.ok){
      if(teamSaved.code==='issue_not_found')T('该工单已被成员删除，本次跟进未写入');
      else T('团队工单跟进未保存，内容已保留，请重试');
      renderIssueDetailModal();
      return;
    }
    detail.draftContent='';
    detail.draftProgress=teamSaved.metadata.issue&&teamSaved.metadata.issue.progress?teamSaved.metadata.issue.progress:requestedProgress;
    detail.draftProgressTouched=false;
    detail.pendingHistoryId='';detail.pendingHistoryCreatedAt='';
    renderApp();
    T(businessWorkbookMessage(teamSaved.metadata.fieldConflict?'跟进已保存；成员在您操作期间更新过该工单，请核对最新结果':'团队工单跟进已保存',teamSaved));
    return;
  }
  appendIssueHistory(issue,'follow_up',content,oldProgress,nextProgress,{id:detail.pendingHistoryId,createdAt:detail.pendingHistoryCreatedAt,status:nextProgress,followerId:follower.id,followerName:follower.name});
  issue.progress=nextProgress;
  issue.followStatus=nextProgress;
  normalizeIssueContract(issue);
  if(oldProgress!=='已完结'&&nextProgress==='已完结') archiveIssue(issue);
  if(oldProgress==='已完结'&&nextProgress!=='已完结') syncIssueArchiveForData(STATE.data,issue);
  var ok=await saveUserData({reason:'followup_created',requestId:detail.pendingHistoryId,issueId:String(issue.id)});
  if(!ok){
    STATE.data=before;
    detail.saving=false;
    renderApp();
    T('跟进记录未保存，内容已保留，请重试');
    return;
  }
  if(ok.conflicts&&ok.conflicts.some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'})){
    detail.saving=false;detail.pendingHistoryId='';detail.pendingHistoryCreatedAt='';
    T('该工单已在另一设备删除，本次跟进未写入');
    return;
  }
  var followUpFieldConflict=(ok.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
  var followUpDeleteConflict=(ok.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
  detail.draftContent='';detail.draftProgress=nextProgress;detail.draftProgressTouched=false;detail.saving=false;
  detail.pendingHistoryId='';detail.pendingHistoryCreatedAt='';
  renderApp();
  T(businessWorkbookMessage(followUpDeleteConflict?'跟进已保存；另一设备曾删除此工单，因有新跟进已自动保留工单':(followUpFieldConflict?'跟进已保存；另一设备也修改了同一字段，当前以本次保存为准，请核对':'跟进记录已保存'),ok));
}

function switchTab(tab){
  if(tab==='team'&&!isAdmin(STATE.user)){T('只有管理员可以进入团队管理');return}
  if(STATE.tab==='issues'&&tab!=='issues') stopVoiceRecognition(true);
  STATE.tab = tab;
  var tabs=document.querySelectorAll('.nav-tab');
  for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active')}
  var target=document.querySelector('.nav-tab[data-tab="'+tab+'"]');
  if(target) target.classList.add('active');
  var panes=document.querySelectorAll('.tab-pane');
  for(var j=0;j<panes.length;j++){panes[j].classList.remove('active')}
  var tp=document.getElementById('pane-'+tab);
  if(tp) tp.classList.add('active');
}

    }
    h+='“清空我的数据”不会删除其他成员数据。';
    h+='</div>';
  }

  return h;
}
