function findIssue(id){
  for(var i=0;i<STATE.data.issues.length;i++){if(String(STATE.data.issues[i].id)===String(id)) return STATE.data.issues[i]}
  return {};
}
async function addIssue(){
  var shop=document.getElementById('iss-shop').value.trim();
  var desc=document.getElementById('iss-desc').value.trim();
  var urgency=normalizeUrgency(document.getElementById('iss-pri').value);
  var assigneeName=normalizeAssigneeName(document.getElementById('iss-assignee').value);
  var dl=document.getElementById('iss-deadline').value;
  if(!shop){T('请填写门店名称');return}
  if(!desc){T('请填写门店问题');return}
  if(!isValidExcelAssignee(assigneeName)){T('请从Excel名单中选择有效跟进人');return}
  if(!canStartMutation())return;
  var formDraft=captureIssueFormDraft();
  var before=cloneJson(STATE.data);
  if(!STATE.pendingNewIssue){
    STATE.pendingNewIssue={issueId:gid(),createdAt:ts(),ticketNumberCreatedAt:nowIso(),historyId:gid(),historyCreatedAt:nowIso()};
  }
  var pending=STATE.pendingNewIssue;
  if(CLOUD_CONFIG.ticketNumberingEnabled===true&&!pending.ticketNo){
    pending.ticketNo=await allocateTicketNo(pending.issueId,pending.ticketNumberCreatedAt||pending.createdAt);
    if(!pending.ticketNo){T('工单编号未能生成，已停止保存，请稍后重试');return}
  }
  var issue=findIssue(pending.issueId);
  var existed=!!issue.id;
  if(!existed){issue={id:pending.issueId,createdAt:pending.createdAt,followUps:[]};STATE.data.issues.unshift(issue)}
  var assignee=findAssigneeByName(assigneeName);
  issue.ticketNo=pending.ticketNo||issue.ticketNo||'';
  issue.shopName=shop;issue.shopDesc=desc;issue.urgency=urgency;issue.priority=urgencyToPriority(urgency);
  issue.assigneeId=assignee.id;issue.assigneeName=assignee.name;issue.deadline=dl;issue.progress='未开始';
  appendIssueHistory(issue,'created','登记工单，当前状态：未跟进','','',{id:pending.historyId,createdAt:pending.historyCreatedAt});
  normalizeIssueContract(issue);
  if(existed)issue.updatedAt=nowIso();
  STATE.voiceParsed = {shop:'', desc:'', pri:'普通', deadline:''};
  STATE.voiceDetected = {shop:'', desc:'', pri:'', deadline:''};
  STATE.voiceText = '';
  STATE.voiceParsedReady = false;
  STATE.voiceMissing = [];
  STATE.issueFormTouched={};
  var saving=saveUserData({reason:'issue_created',requestId:pending.historyId,issueId:String(issue.id)});
  renderApp();
  var saved=await saving;
  if(saved&&!(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'})){
    var newIssueFieldConflict=(saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
    STATE.pendingNewIssue=null;T(businessWorkbookMessage(newIssueFieldConflict?'工单已保存；另一设备也修改了同一字段，请核对当前结果':'工单已登记',saved));return
  }
  if(!saved)STATE.data=before;
  STATE.voiceText=formDraft?formDraft.transcript:'';
  renderApp();
  restoreIssueFormDraft(formDraft);
  T(saved?'同一工单已在另一设备删除，表单内容已保留':'工单未同步，已保留表单内容，请重试');
}
async function updateIssue(){
  var id=STATE.editingIssueId;
  if(!id) return;
  if(!canStartMutation())return;
  var ref=getEditingIssueRef();
  if(!ref||!ref.issue||!ref.issue.id){
    var removedDraft=captureIssueFormDraft();
    clearIssueEditState();STATE.pendingNewIssue=null;
    STATE.voiceText=removedDraft?removedDraft.transcript:'';
    renderApp();restoreIssueFormDraft(Object.assign({},removedDraft||{}, {editingIssueId:null}));
    T('该工单已被另一设备删除；您的编辑内容已保留在新增表单');
    return;
  }
  if(ref.readOnly){T('全数据查看权限不能修改他人工单');return}
  var iss=ref.issue;
  var nextShopName=document.getElementById('iss-shop').value.trim();
  if(!nextShopName){T('请填写门店名称');return}
  var nextShopDesc=document.getElementById('iss-desc').value.trim();
  if(!nextShopDesc){T('请填写门店问题');return}
  var nextAssigneeName=normalizeAssigneeName(document.getElementById('iss-assignee').value);
  if(!isValidExcelAssignee(nextAssigneeName)){T('请从Excel名单中选择有效跟进人');return}
  var nextAssignee=findAssigneeByName(nextAssigneeName);
  var formDraft=captureIssueFormDraft();
  var nextUrgency=normalizeUrgency(document.getElementById('iss-pri').value);
  var values={shopName:nextShopName,shopDesc:nextShopDesc,urgency:nextUrgency,priority:urgencyToPriority(nextUrgency),assigneeId:nextAssignee.id,assigneeName:nextAssignee.name,deadline:document.getElementById('iss-deadline').value};
  var touched=Object.assign({},STATE.issueFormTouched||{});
  if(ref.ownerUserId!==STATE.user.userId){
    var touchedKeys=Object.keys(touched).filter(function(key){return touched[key]});
    if(touchedKeys.length===0){T('尚未修改任何工单字段');return}
    var baseIssue=cloneJson(STATE.editingIssueBase||iss);
    var teamPatch={},fieldMap={shop:'shopName',desc:'shopDesc',deadline:'deadline'};
    Object.keys(fieldMap).forEach(function(formKey){if(touched[formKey])teamPatch[fieldMap[formKey]]=values[fieldMap[formKey]]});
    if(touched.pri){teamPatch.urgency=values.urgency;teamPatch.priority=values.priority}
    if(touched.assignee){teamPatch.assigneeId=values.assigneeId;teamPatch.assigneeName=values.assigneeName}
    var teamResult=await saveTeamIssueMutation(ref.ownerUserId,id,{
      patch:teamPatch,
      history:null,
      expectedIssueUpdatedAt:baseIssue.updatedAt||null,
      syncReason:'issue_updated',syncRequestId:gid()
    });
    if(!teamResult.ok){
      if(teamResult.code==='issue_not_found')T('该工单已被成员删除，编辑内容未写入');
      else T('团队工单修改未同步，表单内容已保留，请重试');
      return;
    }
    clearIssueEditState();
    renderApp();
    T(businessWorkbookMessage(teamResult.metadata.fieldConflict?'修改已保存；成员在您编辑期间更新过该工单，已保留其他最新数据，请核对':'团队工单修改已保存',teamResult));
    return;
  }
  var before=JSON.parse(JSON.stringify(STATE.data));
  iss.shopName=nextShopName;
  iss.shopDesc=values.shopDesc;
  iss.urgency=values.urgency;
  iss.priority=values.priority;
  iss.assigneeId=values.assigneeId;
  iss.assigneeName=values.assigneeName;
  iss.deadline=values.deadline;
  iss.updatedAt=nowIso();
  normalizeIssueContract(iss);
  syncIssueArchiveForData(STATE.data,iss);
  clearIssueEditState();
  var saving=saveUserData({reason:'issue_updated',issueId:String(iss.id)});
  renderApp();
  var saved=await saving;
  if(saved){
    var remotelyDeleted=(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'});
    if(remotelyDeleted){
      clearIssueEditState();STATE.pendingNewIssue=null;STATE.voiceText=formDraft?formDraft.transcript:'';
      var recoveryDraft=Object.assign({},formDraft||{}, {editingIssueId:null});
      renderApp();restoreIssueFormDraft(recoveryDraft);
      T('该工单已在另一设备删除；您的编辑内容已保留在新增表单');
      return;
    }
    var updateDeleteConflict=(saved.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
    T(businessWorkbookMessage(updateDeleteConflict?'修改已保存；另一设备曾删除此工单，因包含新状态记录已自动保留':((saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'})?'修改已保存；另一设备也修改了同一字段，当前以本次保存为准，请核对':'工单修改已保存'),saved));
  }else{
    STATE.data=before;STATE.editingIssueId=id;STATE.editingIssueOwnerUserId=STATE.user.userId;STATE.editingIssueBase=cloneJson(iss);STATE.issueFormTouched=Object.assign({},formDraft&&formDraft.touched||{});
    renderApp();restoreIssueFormDraft(formDraft);T('修改未同步，已保留编辑内容，请重试');
  }
}
function editIssue(id,ownerUserId){
  var owner=ownerUserId||(STATE.user?STATE.user.userId:'');
  var ref=findIssueRef(owner,id);
  if(!ref){T('该工单已删除或无权查看');return}
  if(ref.readOnly){T('全数据查看权限不能修改他人工单');return}
  STATE.editingIssueId=id;
  STATE.editingIssueOwnerUserId=owner;
  STATE.editingIssueBase=cloneJson(ref.issue);
  STATE.issueFormTouched={};
  renderApp();
  window.scrollTo({top:document.getElementById('pane-issues').offsetTop-60,behavior:'smooth'});
}
async function changeProgress(id, prog, ownerUserId){
  prog=safeFollowStatus(prog);
  if(!prog){T('跟进状态仅支持“跟进中”或“已完结”');renderApp();return}
  var owner=ownerUserId||(STATE.user?STATE.user.userId:'');
  if(owner!==STATE.user.userId){
    var ref=findIssueRef(owner,id);
    if(!ref){T('该工单已删除或无权查看');renderApp();return}
    if(ref.readOnly){T('全数据查看权限不能修改他人工单');renderApp();return}
    if(!isValidExcelAssignee(ref.issue.assigneeName)){T('请先编辑工单并选择有效跟进人');renderApp();return}
    var displayedProgress=safeFollowStatus(ref.issue.latestFollowUpStatus||ref.issue.progress)||'跟进中';
    if(displayedProgress===prog)return;
    if(!canStartMutation()){renderApp();return}
    var teamHistoryKey='team-progress:'+owner+':'+String(id)+':'+displayedProgress+'>'+prog;
    var teamHistoryOp=pendingHistoryOperation(teamHistoryKey);
    var result=await saveTeamIssueMutation(owner,id,{
      patch:{progress:prog},
      history:{id:teamHistoryOp.id,type:'status_change',content:'状态更新'},
      expectedIssueUpdatedAt:ref.issue.updatedAt||null,
      syncReason:'issue_status_changed',syncRequestId:teamHistoryOp.id
    });
    if(result.ok){
      delete pendingHistoryOps[teamHistoryKey];
      renderApp();
      T(businessWorkbookMessage(result.metadata.fieldConflict?'进度已保存；成员在您操作期间更新过该工单，请核对最新结果':'团队工单进度已更新',result));
    }else{
      renderApp();
      T(result.code==='issue_not_found'?'该工单已被成员删除':'团队工单进度未同步，请重试');
    }
    return;
  }
  var iss=findIssue(id);
  if(!iss||!iss.id) return;
  if(!isValidExcelAssignee(iss.assigneeName)){T('请先编辑工单并选择有效跟进人');renderApp();return}
  var oldProgress=safeFollowStatus(iss.latestFollowUpStatus||iss.progress)||'跟进中';
  if(oldProgress===prog) return;
  if(!canStartMutation()){renderApp();return}
  var before=JSON.parse(JSON.stringify(STATE.data));
  var wasDone=oldProgress==='已完结';
  iss.progress=prog;
  var historyKey='progress:'+String(id)+':'+oldProgress+'>'+prog;
  var historyOp=pendingHistoryOperation(historyKey);
  appendIssueHistory(iss,'status_change','推进状态由“'+oldProgress+'”变更为“'+prog+'”',oldProgress,prog,historyOp);
  normalizeIssueContract(iss);
  if(!wasDone&&prog==='已完结') archiveIssue(iss);
  if(wasDone&&prog!=='已完结') syncIssueArchiveForData(STATE.data,iss);
  var saving=saveUserData({reason:'issue_status_changed',requestId:historyOp.id,issueId:String(iss.id)});
  renderApp();
  var saved=await saving;
  if(saved){
    delete pendingHistoryOps[historyKey];
    var progressDeleted=(saved.conflicts||[]).some(function(item){return item.type==='update_after_remote_delete'&&item.collection==='issues'});
    var progressConflict=(saved.conflicts||[]).some(function(item){return item.type==='field_conflict'&&item.collection==='issues'});
    var progressDeleteConflict=(saved.conflicts||[]).some(function(item){return item.type==='remote_delete_overridden_by_followup'&&item.collection==='issues'});
    T(progressDeleted?'该工单已在另一设备删除，本次进度未写入':businessWorkbookMessage(progressDeleteConflict?'进度已保存；另一设备曾删除此工单，因有新状态记录已自动保留':(progressConflict?'进度已保存；另一设备也修改了进度，当前以本次保存为准，请核对':'进度已更新'),saved));
  }
  else{STATE.data=before;renderApp();T('进度未同步，已恢复原状态')}
}
async function deleteIssue(id){
  if(!canStartMutation())return;
  if(!confirm('确定删除此工单？\n\n删除后：\n1. 工单会从客户台、驾驶舱及各业务分表中消失；\n2. WPS表格不会删除整行，只清空该工单内容并保留公式、格式和锁定；\n3. 原工单号永久作废，不会重新分配。')) return;
  var before=cloneJson(STATE.data);
  STATE.data.issues=STATE.data.issues.filter(function(i){return String(i.id)!==String(id)});
  STATE.data.archives=STATE.data.archives.filter(function(item){return String(item.sourceIssueId)!==String(id)});
  if(STATE.issueDetail&&STATE.issueDetail.ownerUserId===STATE.user.userId&&STATE.issueDetail.issueId===String(id))STATE.issueDetail=null;
  var saving=saveUserData({reason:'issue_deleted',issueId:String(id)});
  renderApp();
  var saved=await saving;
  if(!saved){STATE.data=before;renderApp();T('删除未同步，工单已恢复，请重试');return}
  if(saved.workbookSync&&saved.workbookSync.pending)scheduleWorkbookDeletionRetry(STATE.user.userId,30000);
  T(saved.conflicts&&saved.conflicts.length?'另一设备刚更新了此工单；为保护最新跟进，本次未删除':businessWorkbookMessage('工单已从客户台删除',saved));
}
function archiveIssue(issue){
  if(syncIssueArchiveForData(STATE.data,issue))T(issue.shopName+' 已归档');
}

var recognition=null;
var isRecognizing=false;
var voiceSessionBase='';
var voiceLastError='';
var voiceSessionId=0;

function stopVoiceRecognition(silent){
  voiceSessionId++;
  if(recognition&&isRecognizing){
    try{recognition.abort()}catch(e){}
  }
  isRecognizing=false;
  voiceLastError='';
  if(!silent) setVoiceUi(false,'录音','录音已停止，可修改文字');
}

function setVoiceUi(recording,label,status){
  var btn=document.getElementById('voice-btn');
  if(btn) btn.classList.toggle('recording',!!recording);
  var labelEl=document.getElementById('voice-btn-label');
  if(labelEl) labelEl.textContent=label||'录音';
  var statusEl=document.getElementById('voice-status');
  if(statusEl&&status) statusEl.textContent=status;
  var transcript=document.getElementById('voice-transcript');
  if(transcript) transcript.readOnly=!!recording;
}

function updateVoiceText(value){
  STATE.voiceText=value;
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var mapped=document.querySelectorAll('.voice-mapped');
  for(var i=0;i<mapped.length;i++) mapped[i].style.display='none';
  var statusEl=document.getElementById('voice-status');
  if(statusEl&&!isRecognizing) statusEl.textContent='文字已修改，请点击“识别并填入”';
}

function writeVoiceTranscript(value){
  STATE.voiceText=value;
  var transcript=document.getElementById('voice-transcript');
  if(transcript){
    transcript.value=value;
    transcript.scrollTop=transcript.scrollHeight;
  }
}

function clearVoiceTranscript(){
  stopVoiceRecognition(true);
  STATE.voiceText='';
  STATE.voiceDetected={shop:'',desc:'',pri:'',deadline:''};
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var transcript=document.getElementById('voice-transcript');
  if(transcript) transcript.value='';
  var mapped=document.querySelectorAll('.voice-mapped');
  for(var i=0;i<mapped.length;i++) mapped[i].style.display='none';
  setVoiceUi(false,'录音','等待录音，或直接输入文字');
}

function startVoice(){
  var hasSR = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
  if(!hasSR){
    T('当前浏览器不支持语音识别。请使用 Chrome/Edge 浏览器打开此页面，或手动填写表单');
    setVoiceUi(false,'录音','当前浏览器不支持麦克风转写，可直接输入文字');
    return;
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(isRecognizing && recognition){
    try{ recognition.stop(); }catch(e){}
    setVoiceUi(false,'整理中...','正在整理最后一段文字...');
    var pendingTranscript=document.getElementById('voice-transcript');
    if(pendingTranscript) pendingTranscript.readOnly=true;
    return;
  }

  try{ if(recognition) recognition.abort(); }catch(e){}
  var transcript=document.getElementById('voice-transcript');
  STATE.voiceText=transcript?transcript.value.trim():STATE.voiceText.trim();
  voiceSessionBase=STATE.voiceText;
  recognition = new SR();
  var activeVoiceSession=++voiceSessionId;
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.continuous = true;

  recognition.onstart = function(){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = true;
    voiceLastError='';
    setVoiceUi(true,'停止','正在录音并实时转写...');
    T('正在聆听，请说出门店信息和问题...');
  };

  recognition.onresult = function(e){
    if(activeVoiceSession!==voiceSessionId) return;
    var finalText='',interimText='';
    for(var i=0; i<e.results.length; i++){
      var segment=e.results[i][0].transcript||'';
      if(e.results[i].isFinal) finalText+=segment;
      else interimText+=segment;
    }
    var current=(voiceSessionBase?voiceSessionBase+' ':'')+finalText+interimText;
    writeVoiceTranscript(current.trim());
    setVoiceUi(true,'停止',interimText?'正在实时转写...':'已记录，继续说或点击停止');
  };

  recognition.onerror = function(e){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = false;
    var msg = '语音识别出错';
    if(e.error === 'not-allowed') msg = '麦克风权限被拒绝，请在浏览器设置中允许麦克风访问';
    else if(e.error === 'no-speech') msg = '未检测到语音，请靠近麦克风再试一次';
    else if(e.error === 'network') msg = '网络连接异常，语音识别需要联网';
    else if(e.error === 'aborted') return;
    else msg = '语音识别失败：' + e.error;
    voiceLastError=msg;
    setVoiceUi(false,'录音',msg);
    T(msg);
  };

  recognition.onend = function(){
    if(activeVoiceSession!==voiceSessionId) return;
    isRecognizing = false;
    setVoiceUi(false,'录音',voiceLastError||(STATE.voiceText?'录音已结束，可修改文字后识别':'未识别到文字，可重新录音'));
  };

  try{
    recognition.start();
  }catch(e){
    T('启动语音识别失败，请刷新页面后重试');
    isRecognizing = false;
    setVoiceUi(false,'录音','启动失败，请刷新页面后重试');
  }
}

function validVoiceDate(year,month,day){
  var d=new Date(year,month-1,day);
  return d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day;
}
function voiceDateText(year,month,day){
  return validVoiceDate(year,month,day)?year+'-'+S(month)+'-'+S(day):'';
}
function parseVoiceDeadline(text){
  var now=new Date(),year=now.getFullYear(),m;
  m=text.match(/(20\d{2})\s*(?:年|[-\/.])\s*(\d{1,2})\s*(?:月|[-\/.])\s*(\d{1,2})\s*[日号]?/);
  if(m) return voiceDateText(parseInt(m[1]),parseInt(m[2]),parseInt(m[3]));
  if(/大后天/.test(text)) return tsOffset(3);
  if(/后天/.test(text)) return tsOffset(2);
  if(/明天|明日/.test(text)) return tsOffset(1);
  if(/今天|今日/.test(text)) return ts();
  m=text.match(/(\d{1,2})\s*天后/);
  if(m) return tsOffset(parseInt(m[1]));
  m=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if(m) return voiceDateText(year,parseInt(m[1]),parseInt(m[2]));
  m=text.match(/(?:本周|下周|周|星期)([一二三四五六日天])/);
  if(m){
    var weekMap={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0};
    var target=weekMap[m[1]],currentDay=now.getDay()||7,targetDay=target||7;
    var diff=/下周/.test(m[0])?(7-currentDay+targetDay):(targetDay-currentDay);
    if(diff<0) diff+=7;
    var wd=new Date(now);wd.setDate(now.getDate()+diff);
    return wd.getFullYear()+'-'+S(wd.getMonth()+1)+'-'+S(wd.getDate());
  }
  return '';
}

function escapeVoiceRegExp(text){return text.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function parseVoiceText(text){
  var normalized=String(text||'').replace(/\s+/g,' ').trim();
  var shop='',desc='',pri='',deadline=parseVoiceDeadline(normalized);

  var explicitGrades=[];
  if(/[Pp]\s*0|P零/.test(normalized)) explicitGrades.push('P0');
  if(/[Pp]\s*1|P一/.test(normalized)) explicitGrades.push('P1');
  if(/[Pp]\s*2|P二/.test(normalized)) explicitGrades.push('P2');
  if(explicitGrades.length===1) pri=explicitGrades[0];
  else if(explicitGrades.length===0){
    if(/最高优先级|特急|紧急(?!程度)/.test(normalized)) pri='P0';
    else if(/高优先级|重要|尽快处理/.test(normalized)) pri='P1';
    else if(/低优先级|紧急程度为低|不紧急/.test(normalized)) pri='低';
    else if(/普通|一般/.test(normalized)) pri='P2';
    else if(/无法营业|全店(?:瘫痪|不可用)|系统(?:完全)?(?:瘫痪|不可用)/.test(normalized)) pri='P0';
    else if(/部分功能不可用|明显影响营业/.test(normalized)) pri='P1';
    else if(/咨询|培训|优化建议/.test(normalized)) pri='P2';
  }

  var shopMatch=normalized.match(/(?:门店名称|店名|门店)\s*(?:是|为|叫|[:：])?\s*([^，,。；;]{2,40})/);
  if(shopMatch){
    shop=shopMatch[1].split(/(?:门店问题|问题描述|问题|故障|异常|情况|优先级|紧急程度|截止)/)[0].trim();
  }
  if(!shop){
    shopMatch=normalized.match(/^([^，,。；;]{2,40}?(?:门店|店|球房|台球厅|俱乐部))(?=[，,。；;\s]|$)/);
    if(shopMatch) shop=shopMatch[1].trim();
  }

  var descMatch=normalized.match(/(?:门店问题|问题描述|问题|故障|异常|情况)\s*(?:是|为|有|[:：])?\s*(.+)/);
  if(descMatch) desc=descMatch[1];
  else desc=normalized;
  desc=desc.replace(/[，,。；;]?\s*(?:优先级|紧急程度)\s*(?:是|为|[:：])?\s*(?:[Pp]\s*[012]|P[零一二]|最高优先级|高优先级|低优先级|紧急|高|重要|普通|低)[\s\S]*$/,'');
  desc=desc.replace(/[，,。；;]?\s*(?:[Pp]\s*[012]|P[零一二])\s*(?:紧急|重要|普通)?[\s\S]*$/,'');
  desc=desc.replace(/[，,。；;]?\s*(?:截止(?:日期|时间)?|要求|计划)\s*(?:是|为|[:：])?[\s\S]*$/,'');
  if(!descMatch&&shop){
    desc=desc.replace(new RegExp('^(?:门店名称|店名|门店)?\\s*(?:是|为|叫|[:：])?\\s*'+escapeVoiceRegExp(shop)),'');
  }
  desc=desc.replace(/^\s*[，,。；;]?\s*(?:门店问题|问题描述|问题|故障|异常|情况)?\s*(?:是|为|有|[:：])?\s*/,'').replace(/[，,。；;\s]+$/,'').trim();
  if(desc===shop) desc='';
  if(pri)pri=normalizeUrgency(pri);

  var missing=[];
  if(!shop) missing.push('门店名称');
  if(!desc) missing.push('门店问题');
  if(!pri) missing.push('紧急程度');
  if(!deadline) missing.push('计划完成时间');
  return {shop:shop,desc:desc,pri:pri,deadline:deadline,missing:missing};
}

function recognizeVoiceText(){
  var transcript=document.getElementById('voice-transcript');
  var text=(transcript?transcript.value:STATE.voiceText).trim();
  if(!text){T('请先录音或输入需要识别的文字');return}
  STATE.voiceText=text;
  var currentShop=document.getElementById('iss-shop');
  var currentDesc=document.getElementById('iss-desc');
  var currentPri=document.getElementById('iss-pri');
  var currentDeadline=document.getElementById('iss-deadline');
  var parsed=parseVoiceText(text);
  STATE.voiceParsed={
    shop:parsed.shop||(currentShop?currentShop.value:''),
    desc:parsed.desc||(currentDesc?currentDesc.value:''),
    pri:parsed.pri||(currentPri?currentPri.value:'普通'),
    deadline:parsed.deadline||(currentDeadline?currentDeadline.value:'')
  };
  STATE.voiceDetected={shop:parsed.shop,desc:parsed.desc,pri:parsed.pri,deadline:parsed.deadline};
  STATE.voiceMissing=parsed.missing;
  STATE.voiceParsedReady=true;
  if(STATE.editingIssueId){
    if(parsed.shop)markIssueFieldTouched('shop');
    if(parsed.desc)markIssueFieldTouched('desc');
    if(parsed.pri)markIssueFieldTouched('pri');
    if(parsed.deadline)markIssueFieldTouched('deadline');
  }
  renderApp();
  var targetShop=document.getElementById('iss-shop');
  var targetDesc=document.getElementById('iss-desc');
  var targetPri=document.getElementById('iss-pri');
  var targetDeadline=document.getElementById('iss-deadline');
  if(targetShop) targetShop.value=STATE.voiceParsed.shop;
  if(targetDesc) targetDesc.value=STATE.voiceParsed.desc;
  if(targetPri) targetPri.value=STATE.voiceParsed.pri;
  if(targetDeadline) targetDeadline.value=STATE.voiceParsed.deadline;
  T(parsed.missing.length?'已填写可识别内容；请确认：'+parsed.missing.join('、'):'文字已识别并填入，请核对后添加');
  if(parsed.missing.length){
    var idMap={'门店名称':'iss-shop','门店问题':'iss-desc','紧急程度':'iss-pri','计划完成时间':'iss-deadline'};
    setTimeout(function(){var el=document.getElementById(idMap[parsed.missing[0]]);if(el)el.focus()},50);
  }
}

function renderKnowledge(){

  // Add form
  h+='<div class="card" style="border-style:dashed">';
  h+='<div style="font-weight:700;font-size:13px;margin-bottom:8px">新增知识沉淀</div>';

      h+='<div style="font-size:11px;color:var(--warning);margin-top:8px">待专项实测 · 只读</div></div>';

      h+='<div style="margin-top:8px"><button class="btn btn-xs btn-outline-danger" onclick="deleteKnowledge(decodeURIComponent(\''+inlineArg(k.id)+'\'))">删除</button></div>';

async function addKnowledge(){
  var dom=document.getElementById('kw-domain').value.trim();
  var code=document.getElementById('kw-code').value.trim();
  var title=document.getElementById('kw-title').value.trim();
  var content=document.getElementById('kw-content').value.trim();
  if(!title){T('请填写标题');return}
  if(!canStartMutation())return;
  STATE.data.knowledge.unshift({id:gid(),domain:dom,code:code,title:title,content:content});
  var saving=saveUserData();
  renderApp();
  T((await saving)?'已添加到知识库并同步':'知识未同步，请重试');
}
async function deleteKnowledge(id){
  if(!canStartMutation())return;
  if(!confirm('确定删除此知识项？')) return;
  STATE.data.knowledge=STATE.data.knowledge.filter(function(k){return k.id!==id});
  var saving=saveUserData();
  renderApp();
  T((await saving)?'已删除并同步云端':'删除未同步，请重试');
}

function adminFullWorkbookSyncState(){
  var state=STATE.adminFullWorkbookSync;
  if(!state||typeof state!=='object'){
    state={status:'idle',message:'',requestId:''};
    STATE.adminFullWorkbookSync=state;
  }
  return state;
}
function adminFullWorkbookSyncFailureMessage(result){
  result=result&&typeof result==='object'?result:{};
  if(result.skipped&&result.status==='disabled')return '当前 WPS 联动尚未启用，未执行全量同步。客户管家台数据没有改动。';
  if(result.status==='unavailable')return '当前登录会话无法连接同步服务，未执行全量同步。请刷新页面后重试。';
  var details=result.details&&typeof result.details==='object'?result.details:{};
  var detailMessage=String(details.message||result.error&&result.error.message||'').trim();
  return '全量同步未完成'+(detailMessage?'：'+detailMessage:'')+'。客户管家台数据没有改动，可稍后重试。';
}
function renderAdminFullWorkbookSyncPanel(){
  if(!isAdmin(STATE.user))return '';
  var state=adminFullWorkbookSyncState();
  var running=state.status==='running';
  var statusStyle=state.status==='success'
    ? 'background:var(--success2);color:#047857;border-color:#a7f3d0'
    : (state.status==='failed'
      ? 'background:var(--danger2);color:var(--danger);border-color:#fecaca'
      : 'background:var(--primary-lighter);color:var(--primary-dark);border-color:var(--primary-light)');
  var h='<div class="card" id="admin-full-wps-sync-panel">';
  h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">';
  h+='<div style="flex:1;min-width:220px"><div style="font-size:14px;font-weight:700;margin-bottom:4px">全量同步到 WPS</div>'+
    '<div style="font-size:12px;line-height:1.7;color:var(--text2)">将 Supabase 当前全部工单和跟进记录核对并镜像到 WPS。此操作不会修改客户管家台的工单业务数据。</div></div>';
  h+='<button id="admin-full-wps-sync-button" class="btn btn-sm btn-primary" onclick="runAdminFullWorkbookSync()"'+
    (running?' disabled aria-busy="true" style="opacity:.65;cursor:not-allowed"':'')+'>'+I.refresh+' '+(running?'正在全量同步…':'开始全量同步')+'</button>';
  h+='</div>';
  if(state.message){
    h+='<div id="admin-full-wps-sync-status" role="status" aria-live="polite" style="margin-top:10px;padding:9px 11px;border:1px solid;border-radius:var(--rxs);font-size:12px;line-height:1.7;'+statusStyle+'">'+esc(state.message)+'</div>';
  }
  h+='</div>';
  return h;
}
async function runAdminFullWorkbookSync(){
  if(!isAdmin(STATE.user)){
    T('只有管理员可以执行 WPS 全量同步');
    return {ok:false,status:'forbidden'};
  }
  var current=adminFullWorkbookSyncState();
  if(current.status==='running')return {ok:false,status:'already_running',requestId:current.requestId};
  if(!confirm('确认把 Supabase 当前全部工单和跟进记录全量同步到 WPS？\n\n同步期间请不要重复点击。此操作不会修改客户管家台的工单业务数据。')){
    return {ok:false,status:'cancelled'};
  }
  var requestId='admin-full-wps:'+String(STATE.user.userId||'admin')+':'+gid();
  STATE.adminFullWorkbookSync={status:'running',message:'正在核对并同步全部工单和跟进记录，请勿重复点击…',requestId:requestId};
  setCloudStatus('正在执行 WPS 全量同步','var(--primary)');
  renderApp();
  try{
    var result=await requestWorkbookSync('admin_manual_full_sync',{mode:'full',requestId:requestId});
    if(result&&result.workbookSynced){
      var data=result.data&&typeof result.data==='object'?result.data:{};
      var counts=[];
      if(Number.isFinite(Number(data.tickets)))counts.push(Number(data.tickets)+' 张工单');
      if(Number.isFinite(Number(data.followups)))counts.push(Number(data.followups)+' 条跟进');
      if(Number(data.deletions)>0)counts.push(Number(data.deletions)+' 条删除项');
      var prefix=result.status==='unchanged'?'全量核对完成，WPS 已是最新':'全量同步成功，WPS 已更新';
      var message=prefix+(counts.length?'；已核对 '+counts.join('、'):'')+'。';
      STATE.adminFullWorkbookSync={status:'success',message:message,requestId:requestId};
      setCloudStatus('WPS 全量同步已完成','var(--success)');
      renderApp();
      T(message);
      return result;
    }
    var failureMessage=adminFullWorkbookSyncFailureMessage(result);
    STATE.adminFullWorkbookSync={status:'failed',message:failureMessage,requestId:requestId};
    setCloudStatus('WPS 全量同步未完成，请稍后重试','var(--warning)');
    renderApp();
    T(failureMessage);
    return result||{ok:false,status:'failed',requestId:requestId};
  }catch(error){
    var failure=adminFullWorkbookSyncFailureMessage({error:error});
    STATE.adminFullWorkbookSync={status:'failed',message:failure,requestId:requestId};
    setCloudStatus('WPS 全量同步未完成，请稍后重试','var(--warning)');
    renderApp();
    T(failure);
    return {ok:false,status:'failed',error:error,requestId:requestId};
  }
}

function handleImportFile(input){
  var name=document.getElementById('imp-name').value.trim();
  var dept=document.getElementById('imp-dept').value.trim();
  if(!name){T('请填写成员姓名');input.value='';return}
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=async function(e){
    importMemberData(name, dept, e.target.result);
    renderApp();
  };
  reader.readAsText(file);
  input.value='';
}

// ====== 数据导入导出 ======
function exportData(){
  var exp={issues:STATE.data.issues,knowledge:STATE.data.knowledge,archives:STATE.data.archives,dailySupps:STATE.data.dailySupps,user:STATE.user?{name:STATE.user.name,department:STATE.user.department,role:STATE.user.role}:null,exportedAt:ts()};
  var json=JSON.stringify(exp,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='商云宝备份_'+ts()+'.json';
  a.click();
  T('导出成功');
}
function importData(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.issues){T('无效的备份文件格式');return}
      if(!canStartMutation()){input.value='';return}
      if(!confirm('将用备份数据覆盖当前数据（共'+d.issues.length+'条问题、'+(d.knowledge?d.knowledge.length:0)+'条知识），确定继续？')){input.value='';return}
      STATE.data.issues=d.issues||[];
      STATE.data.knowledge=d.knowledge||[];
      STATE.data.archives=d.archives||[];
      STATE.data.dailySupps=d.dailySupps||{};
      var saving=saveUserData({reason:'data_imported',fullSync:true});
      renderApp();
      var saved=await saving;
      T(saved?businessWorkbookMessage('数据已恢复',saved):'恢复数据未同步，请重试');
    }catch(err){T('JSON解析失败，请检查文件')}
  };
  reader.readAsText(file);
  input.value='';
}
async function confirmClear(){
  if(!canStartMutation())return;
  var hasTeamAccess=canViewTeamData(STATE.user);
  var scopeText=hasTeamAccess?'仅清空当前账号“'+STATE.user.name+'”的个人数据，不会删除其他成员数据。':'将清空当前账号的全部数据。';
  if(!confirm('⚠️ '+scopeText+'\n包括问题、知识库、归档和备注，此操作不可恢复！\n\n确定继续？')) return;
  if(!confirm('再次确认：'+(hasTeamAccess?'清空我的数据（保留团队成员数据）？':'清空当前账号全部数据？'))) return;
  stopVoiceRecognition(true);
  STATE.data={issues:[],knowledge:[],archives:[],dailySupps:{}};
  clearIssueEditState();
  STATE.issueDetail=null;
  STATE.pendingNewIssue=null;
  pendingHistoryOps={};
  STATE.voiceText='';
  STATE.voiceParsed={shop:'',desc:'',pri:'普通',deadline:''};
  STATE.voiceDetected={shop:'',desc:'',pri:'',deadline:''};
  STATE.voiceParsedReady=false;
  STATE.voiceMissing=[];
  var saving=saveUserData({reason:'data_cleared',fullSync:true});

  T(saved?businessWorkbookMessage(hasTeamAccess?'我的数据已清空，团队成员数据已保留':'当前账号数据已清空',saved):'清空操作未同步，请重试');
}

// ====== 初始化 ======
function scheduleFocusRefresh(){
  clearTimeout(focusRefreshTimer);
  focusRefreshTimer=setTimeout(function(){
    if(STATE.user) refreshFromCloud({source:'focus'});
  },300);
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') scheduleFocusRefresh();
});
window.addEventListener('focus',scheduleFocusRefresh);
window.addEventListener('beforeunload',function(event){
  stopVoiceRecognition(true);
  if(pendingSaves>0){
    event.preventDefault();
    event.returnValue='';
  }
});
(async function init(){
  if(!db){
    showLogin('云端配置缺失，请联系管理员');
    return;
  }
  try{
    var sessionResult=await db.auth.getSession();
    if(sessionResult.error) throw sessionResult.error;
    if(sessionResult.data.session&&sessionResult.data.session.user){
      await startUserSession(sessionResult.data.session.user);
      return;
    }
  }catch(error){
    console.error('[商云宝] 云端初始化失败',error);
    if(isAccountDeactivatedError(error)){
      await handleDeactivatedSession();
      return;
    }
    showLogin('云端连接失败，请刷新页面重试');
    return;
  }
  showLogin();
})();
